<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Бесплатный курс Python</title>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a23;
    --bg-2: #1b1b32;
    --bg-3: #2a2a4a;
    --text: #dfdfe2;
    --text-dim: #a0a0b0;
    --accent: #f1be32;
    --accent-2: #f1be32;
    --success: #acd157;
    --error: #ff6b6b;
    --border: #3b3b4f;
  }
  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--bg-2);
    border-bottom: 2px solid var(--accent);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-size: 24px;
    font-weight: bold;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    color: var(--bg);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
  }
  .header-actions { display: flex; gap: 12px; align-items: center; }
  .progress-bar {
    width: 200px; height: 10px;
    background: var(--bg-3);
    border-radius: 5px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s;
  }
  .btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-success { background: var(--success); }
  .btn-error { background: var(--error); }

  .container {
    display: flex;
    flex: 1;
    min-height: 0;
  }
  .sidebar {
    width: 300px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0;
  }
  .sidebar h3 {
    padding: 0 16px 12px;
    color: var(--accent);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .module {
    margin-bottom: 8px;
  }
  .module-title {
    padding: 10px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    color: var(--text-dim);
    transition: background 0.2s;
  }
  .module-title:hover { background: var(--bg-3); color: var(--text); }
  .module-title.active { color: var(--accent); }
  .module-title .arrow { transition: transform 0.2s; }
  .module.open .arrow { transform: rotate(90deg); }
  .lessons {
    display: none;
    background: var(--bg);
  }
  .module.open .lessons { display: block; }
  .lesson-item {
    padding: 8px 16px 8px 32px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    border-left: 3px solid transparent;
    transition: all 0.2s;
  }
  .lesson-item:hover { background: var(--bg-3); color: var(--text); }
  .lesson-item.active {
    background: var(--bg-3);
    color: var(--accent);
    border-left-color: var(--accent);
  }
  .lesson-item.completed::before {
    content: "✓";
    color: var(--success);
    font-weight: bold;
  }
  .lesson-item:not(.completed)::before {
    content: "○";
    color: var(--text-dim);
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .content-area {
    flex: 1;
    overflow-y: auto;
    padding: 32px 48px;
    max-width: 100%;
  }
  .lesson-title {
    font-size: 28px;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .lesson-subtitle {
    color: var(--text-dim);
    margin-bottom: 24px;
    font-size: 14px;
  }
  .lesson-content {
    line-height: 1.7;
    font-size: 16px;
  }
  .lesson-content h2 {
    color: var(--accent);
    margin: 24px 0 12px;
    font-size: 22px;
  }
  .lesson-content h3 {
    color: var(--text);
    margin: 18px 0 10px;
    font-size: 18px;
  }
  .lesson-content p { margin-bottom: 12px; }
  .lesson-content ul, .lesson-content ol {
    margin: 12px 0 12px 24px;
  }
  .lesson-content li { margin-bottom: 6px; }
  .lesson-content code {
    background: var(--bg-3);
    padding: 2px 6px;
    border-radius: 3px;
    color: var(--accent);
    font-family: 'Consolas', monospace;
    font-size: 14px;
  }
  .lesson-content pre {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    padding: 16px;
    border-radius: 4px;
    overflow-x: auto;
    margin: 16px 0;
  }
  .lesson-content pre code {
    background: transparent;
    padding: 0;
    color: var(--text);
  }
  .info-box {
    background: var(--bg-3);
    border-left: 4px solid var(--accent);
    padding: 12px 16px;
    margin: 16px 0;
    border-radius: 4px;
  }
  .info-box strong { color: var(--accent); }

  .task-area {
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    padding: 20px 48px;
  }
  .task-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .task-title {
    font-size: 18px;
    color: var(--accent);
    font-weight: bold;
  }
  .task-description {
    background: var(--bg);
    padding: 12px 16px;
    border-radius: 4px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.6;
  }
  .task-description code {
    background: var(--bg-3);
    padding: 2px 6px;
    border-radius: 3px;
    color: var(--accent);
    font-family: 'Consolas', monospace;
  }
  .editor-container {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
  }
  .editor-wrap, .output-wrap {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .editor-header {
    background: var(--bg-3);
    padding: 6px 12px;
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
  }
  #codeEditor {
    width: 100%;
    min-height: 180px;
    background: var(--bg);
    color: var(--text);
    border: none;
    padding: 12px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
  }
  #output {
    padding: 12px;
    font-family: 'Consolas', monospace;
    font-size: 13px;
    min-height: 180px;
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    color: var(--text);
  }
  .output-line { margin-bottom: 2px; }
  .output-error { color: var(--error); }
  .output-success { color: var(--success); }
  .output-info { color: var(--accent); }

  .task-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .test-results {
    margin-top: 12px;
    padding: 12px;
    background: var(--bg);
    border-radius: 4px;
    border: 1px solid var(--border);
    display: none;
  }
  .test-results.show { display: block; }
  .test-item {
    padding: 6px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }
  .test-pass { color: var(--success); }
  .test-fail { color: var(--error); }

  .welcome-screen {
    text-align: center;
    padding: 60px 20px;
  }
  .welcome-screen h1 {
    font-size: 48px;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .welcome-screen p {
    font-size: 18px;
    color: var(--text-dim);
    max-width: 600px;
    margin: 0 auto 32px;
    line-height: 1.6;
  }
  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    max-width: 900px;
    margin: 40px auto;
  }
  .feature {
    background: var(--bg-2);
    padding: 24px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .feature-icon {
    font-size: 32px;
    margin-bottom: 12px;
  }
  .feature h3 {
    color: var(--accent);
    margin-bottom: 8px;
  }
  .feature p {
    color: var(--text-dim);
    font-size: 14px;
  }

  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: var(--bg-2);
    padding: 40px;
    border-radius: 8px;
    max-width: 500px;
    text-align: center;
    border: 2px solid var(--accent);
  }
  .certificate {
    background: linear-gradient(135deg, var(--bg-3), var(--bg-2));
    border: 3px double var(--accent);
    padding: 40px;
    margin: 20px 0;
    border-radius: 8px;
  }
  .certificate h2 {
    color: var(--accent);
    font-size: 28px;
    margin-bottom: 12px;
  }
  .certificate p {
    margin: 8px 0;
    color: var(--text);
  }
  .certificate .date {
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 20px;
  }

  @media (max-width: 900px) {
    .sidebar { width: 240px; }
    .content-area, .task-area { padding: 20px; }
    .editor-container { flex-direction: column; }
  }
  @media (max-width: 600px) {
    .container { flex-direction: column; }
    .sidebar { width: 100%; max-height: 40vh; }
    .progress-bar { width: 100px; }
    .welcome-screen h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">Py</div>
    <span>PyCamp</span>
  </div>
  <div class="header-actions">
    <div class="progress-bar" title="Прогресс курса">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    <span id="progressText" style="font-size: 13px; color: var(--text-dim);">0%</span>
    <button class="btn btn-secondary" onclick="resetProgress()">Сброс</button>
    <button class="btn" onclick="showCertificate()" id="certBtn" style="display:none">Сертификат</button>
  </div>
</header>

<div class="container">
  <aside class="sidebar">
    <h3>📘 Программа курса</h3>
    <div id="sidebarContent"></div>
  </aside>

  <main class="main">
    <div class="content-area" id="contentArea"></div>
    <div class="task-area" id="taskArea" style="display:none">
      <div class="task-header">
        <div class="task-title" id="taskTitle">📝 Задание</div>
      </div>
      <div class="task-description" id="taskDescription"></div>
      <div class="editor-container">
        <div class="editor-wrap">
          <div class="editor-header">Редактор Python</div>
          <textarea id="codeEditor" spellcheck="false"></textarea>
        </div>
        <div class="output-wrap">
          <div class="editor-header">Вывод программы</div>
          <div id="output"></div>
        </div>
      </div>
      <div class="task-actions">
        <button class="btn" onclick="runCode()">▶ Запустить</button>
        <button class="btn btn-success" onclick="checkSolution()">✓ Проверить решение</button>
        <button class="btn btn-secondary" onclick="resetCode()">↺ Сбросить код</button>
        <button class="btn btn-secondary" onclick="showHint()">💡 Подсказка</button>
      </div>
      <div class="test-results" id="testResults"></div>
    </div>
  </main>
</div>

<div class="modal" id="certModal">
  <div class="modal-content">
    <div class="certificate">
      <h2>🏆 СЕРТИФИКАТ</h2>
      <p style="font-size: 14px; color: var(--text-dim);">PyCamp подтверждает, что</p>
      <p style="font-size: 22px; color: var(--accent); font-weight: bold; margin: 16px 0;">Студент</p>
      <p>успешно завершил полный курс</p>
      <p style="font-size: 20px; color: var(--accent); margin: 12px 0;">«Python с нуля до уверенного уровня»</p>
      <p class="date" id="certDate"></p>
    </div>
    <button class="btn" onclick="closeCert()">Закрыть</button>
  </div>
</div>

<script>
// ============ ДАННЫЕ КУРСА ============
const courseData = [
  {
    title: "1. Введение в Python",
    lessons: [
      {
        title: "Что такое Python",
        content: `
          <h2>Добро пожаловать в мир Python!</h2>
          <p><strong>Python</strong> — это высокоуровневый язык программирования, созданный Гвидо ван Россумом в 1991 году. Он известен своим простым и читаемым синтаксисом.</p>
          <h3>Почему стоит учить Python?</h3>
          <ul>
            <li><strong>Простой синтаксис</strong> — код читается почти как английский текст</li>
            <li><strong>Универсальность</strong> — веб, наука, игры, ИИ, автоматизация</li>
            <li><strong>Огромное сообщество</strong> — миллионы разработчиков</li>
            <li><strong>Востребованность</strong> — одна из самых популярных профессий</li>
          </ul>
          <h3>Ваша первая программа</h3>
          <p>Традиционно изучение любого языка начинают с программы "Hello, World!". В Python это делается одной строкой:</p>
          <pre><code>print("Hello, World!")</code></pre>
          <p>Функция <code>print()</code> выводит текст на экран. Текст (строка) заключается в кавычки.</p>
          <div class="info-box"><strong>💡 Запомните:</strong> Python чувствителен к регистру. <code>Print</code> и <code>print</code> — это разные вещи!</div>
        `,
        task: {
          title: "Задание: Привет, мир!",
          description: "Выведите на экран фразу <code>Hello, World!</code> с помощью функции <code>print()</code>.",
          starterCode: '# Напишите свою первую программу\n',
          tests: [
            { check: (out) => out.includes("Hello, World!"), msg: "Программа выводит 'Hello, World!'" }
          ]
        }
      },
      {
        title: "Комментарии и стиль кода",
        content: `
          <h2>Комментарии в Python</h2>
          <p>Комментарии — это пояснения в коде, которые игнорируются интерпретатором. Они помогают другим (и вам в будущем) понять, что делает программа.</p>
          <h3>Однострочные комментарии</h3>
          <p>Начинаются с символа <code>#</code>:</p>
          <pre><code># Это комментарий
print("Привет")  # Это тоже комментарий</code></pre>
          <h3>Многострочные комментарии</h3>
          <p>Используются тройные кавычки:</p>
          <pre><code>"""
Это многострочный
комментарий (docstring)
"""</code></pre>
          <h3>Стиль кода (PEP 8)</h3>
          <p>В Python принят стандарт оформления кода — <strong>PEP 8</strong>. Основные правила:</p>
          <ul>
            <li>Используйте 4 пробела для отступов (не табы!)</li>
            <li>Имена переменных — в нижнем регистре с подчёркиваниями: <code>my_variable</code></li>
            <li>Максимальная длина строки — 79 символов</li>
            <li>Добавляйте пробелы вокруг операторов: <code>x = 5 + 3</code></li>
          </ul>
        `,
        task: {
          title: "Задание: Комментарии",
          description: "Напишите программу, которая выводит <code>Python</code>. Добавьте комментарий перед командой print, объясняющий, что она делает.",
          starterCode: '# Ваш код здесь\n',
          tests: [
            { check: (out) => out.trim() === "Python", msg: "Программа выводит 'Python'" },
            { check: (code) => code.includes("#"), msg: "В коде есть комментарий" }
          ]
        }
      }
    ]
  },
  {
    title: "2. Переменные и типы данных",
    lessons: [
      {
        title: "Переменные",
        content: `
          <h2>Что такое переменная?</h2>
          <p><strong>Переменная</strong> — это именованная область памяти, которая хранит значение. Представьте её как коробку с подписью.</p>
          <pre><code>name = "Алиса"
age = 25
print(name)
print(age)</code></pre>
          <h3>Правила именования переменных</h3>
          <ul>
            <li>Могут содержать буквы, цифры и символ подчёркивания <code>_</code></li>
            <li>Не могут начинаться с цифры</li>
            <li>Регистр важен: <code>Name</code> и <code>name</code> — разные переменные</li>
            <li>Нельзя использовать зарезервированные слова (<code>if</code>, <code>for</code>, <code>class</code> и т.д.)</li>
          </ul>
          <h3>Присваивание значений</h3>
          <p>Оператор <code>=</code> присваивает значение переменной:</p>
          <pre><code>x = 10
x = x + 5   # теперь x = 15
y = z = 0   # несколько переменных сразу</code></pre>
          <div class="info-box"><strong>💡 Важно:</strong> В Python не нужно объявлять тип переменной — он определяется автоматически.</div>
        `,
        task: {
          title: "Задание: Создайте переменные",
          description: "Создайте переменную <code>name</code> со значением <code>Python</code> и переменную <code>version</code> со значением <code>3</code>. Выведите их через пробел одной командой print.",
          starterCode: '# Создайте переменные name и version\n# Выведите их на экран\n',
          tests: [
            { check: (out) => out.trim() === "Python 3", msg: "Вывод: 'Python 3'" },
            { check: (code) => code.includes("name") && code.includes("version"), msg: "Используются переменные name и version" }
          ]
        }
      },
      {
        title: "Числа и арифметика",
        content: `
          <h2>Числовые типы данных</h2>
          <p>В Python есть два основных числовых типа:</p>
          <ul>
            <li><code>int</code> — целые числа: <code>5</code>, <code>-10</code>, <code>0</code></li>
            <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
          </ul>
          <h3>Арифметические операции</h3>
          <pre><code>a = 10
b = 3

print(a + b)   # 13  — сложение
print(a - b)   # 7   — вычитание
print(a * b)   # 30  — умножение
print(a / b)   # 3.333... — деление
print(a // b)  # 3   — целочисленное деление
print(a % b)   # 1   — остаток от деления
print(a ** b)  # 1000 — возведение в степень</code></pre>
          <h3>Приоритет операций</h3>
          <p>Как в математике: сначала скобки, потом степень, умножение/деление, сложение/вычитание.</p>
          <pre><code>result = 2 + 3 * 4    # 14, а не 20
result = (2 + 3) * 4  # 20</code></pre>
        `,
        task: {
          title: "Задание: Калькулятор",
          description: "Вычислите и выведите результат выражения: <code>(15 + 5) * 2 - 10 / 2</code>. Ответ должен быть <code>35.0</code>.",
          starterCode: '# Вычислите выражение и выведите результат\n',
          tests: [
            { check: (out) => out.trim() === "35.0", msg: "Результат: 35.0" }
          ]
        }
      },
      {
        title: "Строки",
        content: `
          <h2>Строки (str)</h2>
          <p><strong>Строка</strong> — это последовательность символов. Создаётся с помощью кавычек:</p>
          <pre><code>s1 = 'Привет'

function saveState() {
  localStorage.setItem('pycamp_completed', JSON.stringify(state.completed));
  localStorage.setItem('pycamp_code', JSON.stringify(state.code));
}

function getLessonKey(m, l) { return `${m}-${l}`; }

function getTotalLessons() {
  return courseData.reduce((sum, m) => sum + m.lessons.length, 0);
}

function getCompletedCount() {
  return Object.keys(state.completed).length;
}

function updateProgress() {
  const total = getTotalLessons();
  const done = getCompletedCount();
  const percent = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('progressFill').style.width = percent + '%';
  document.getElementById('progressText').textContent = `${done}/${total} (${percent}%)`;
  document.getElementById('certBtn').style.display = percent === 100 ? 'inline-block' : 'none';
}

// ============ ОТРИСОВКА САЙДБАРА ============
function renderSidebar() {
  const container = document.getElementById('sidebarContent');
  container.innerHTML = '';
  courseData.forEach((module, mIdx) => {
    const moduleEl = document.createElement('div');
    moduleEl.className = 'module' + (mIdx === state.currentModule ? ' open' : '');
    
    const titleEl = document.createElement('div');
    titleEl.className = 'module-title' + (mIdx === state.currentModule ? ' active' : '');
    titleEl.innerHTML = `<span>${module.title}</span><span class="arrow">▶</span>`;
    titleEl.onclick = () => {
      document.querySelectorAll('.module').forEach(m => m.classList.remove('open'));
      moduleEl.classList.toggle('open');
    };
    
    const lessonsEl = document.createElement('div');
    lessonsEl.className = 'lessons';
    
    module.lessons.forEach((lesson, lIdx) => {
      const key = getLessonKey(mIdx, lIdx);
      const itemEl = document.createElement('div');
      itemEl.className = 'lesson-item';
      if (state.completed[key]) itemEl.classList.add('completed');
      if (mIdx === state.currentModule && lIdx === state.currentLesson) itemEl.classList.add('active');
      itemEl.textContent = lesson.title;
      itemEl.onclick = () => loadLesson(mIdx, lIdx);
      lessonsEl.appendChild(itemEl);
    });
    
    moduleEl.appendChild(titleEl);
    moduleEl.appendChild(lessonsEl);
    container.appendChild(moduleEl);
  });
}

// ============ ЗАГРУЗКА УРОКА ============
function loadLesson(mIdx, lIdx) {
  state.currentModule = mIdx;
  state.currentLesson = lIdx;
  const lesson = courseData[mIdx].lessons[lIdx];
  const key = getLessonKey(mIdx, lIdx);
  
  const contentArea = document.getElementById('contentArea');
  contentArea.innerHTML = `
    <h1 class="lesson-title">${lesson.title}</h1>
    <div class="lesson-subtitle">Модуль ${mIdx + 1}, Урок ${lIdx + 1} из ${courseData[mIdx].lessons.length}</div>
    <div class="lesson-content">${lesson.content}</div>
  `;
  contentArea.scrollTop = 0;
  
  const taskArea = document.getElementById('taskArea');
  if (lesson.task) {
    taskArea.style.display = 'block';
    document.getElementById('taskTitle').textContent = '📝 ' + lesson.task.title;
    document.getElementById('taskDescription').innerHTML = lesson.task.description;
    const savedCode = state.code[key] || lesson.task.starterCode;
    document.getElementById('codeEditor').value = savedCode;
    document.getElementById('output').innerHTML = '';
    document.getElementById('testResults').classList.remove('show');
  } else {
    taskArea.style.display = 'none';
  }
  
  renderSidebar();
  updateProgress();
}

// ============ ВЫПОЛНЕНИЕ PYTHON КОДА ============
function runPythonCode(code) {
  return new Promise((resolve) => {
    let output = '';
    const outputEl = document.getElementById('output');
    outputEl.innerHTML = '';
    
    function outf(text) {
      output += text;
      const line = document.createElement('div');
      line.className = 'output-line';
      line.textContent = text;
      outputEl.appendChild(line);
    }
    
    function builtinRead(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
        throw "File not found: '" + x + "'";
      }
      return Sk.builtinFiles["files"][x];
    }
    
    Sk.configure({
      output: outf,
      read: builtinRead,
      __future__: Sk.python3
    });
    
    Sk.misceval.asyncToPromise(function() {
      return Sk.importMainWithBody("<stdin>", false, code, true);
    }).then(function() {
      resolve({ success: true, output: output });
    }).catch(function(err) {
      const line = document.createElement('div');
      line.className = 'output-line output-error';
      line.textContent = err.toString();
      outputEl.appendChild(line);
      resolve({ success: false, output: output, error: err.toString() });
    });
  });
}

async function runCode() {
  const code = document.getElementById('codeEditor').value;
  const key = getLessonKey(state.currentModule, state.currentLesson);
  state.code[key] = code;
  saveState();
  await runPythonCode(code);
}

async function checkSolution() {
  const code = document.getElementById('codeEditor').value;
  const lesson = courseData[state.currentModule].lessons[state.currentLesson];
  if (!lesson.task) return;
  
  const result = await runPythonCode(code);
  const tests = lesson.task.tests;
  const resultsEl = document.getElementById('testResults');
  resultsEl.innerHTML = '';
  resultsEl.classList.add('show');
  
  let allPassed = true;
  tests.forEach(test => {
    const item = document.createElement('div');
    item.className = 'test-item';
    let passed = false;
    try {
      passed = test.check(result.output, code);
    } catch (e) {
      passed = false;
    }
    if (passed) {
      item.className += ' test-pass';
      item.innerHTML = `<span>✓</span><span>${test.msg}</span>`;
    } else {
      item.className += ' test-fail';
      item.innerHTML = `<span>✗</span><span>${test.msg}</span>`;
      allPassed = false;
    }
    resultsEl.appendChild(item);
  });
  
  if (allPassed) {
    const key = getLessonKey(state.currentModule, state.currentLesson);
    if (!state.completed[key]) {
      state.completed[key] = true;
      saveState();
      renderSidebar();
      updateProgress();
      const successLine = document.createElement('div');
      successLine.className = 'output-line output-success';
      successLine.textContent = '🎉 Отлично! Задание выполнено!';
      document.getElementById('output').appendChild(successLine);
      
      // Автопереход к следующему уроку через 1.5 сек
      setTimeout(() => {
        goToNextLesson();
      }, 1500);
    }
  }
}

function goToNextLesson() {
  const module = courseData[state.currentModule];
  if (state.currentLesson < module.lessons.length - 1) {
    loadLesson(state.currentModule, state.currentLesson + 1);
  } else if (state.currentModule < courseData.length - 1) {
    loadLesson(state.currentModule + 1, 0);
  } else {
    alert('🎉 Поздравляем! Вы завершили весь курс!');
  }
}

function resetCode() {
  const lesson = courseData[state.currentModule].lessons[state.currentLesson];
  if (lesson.task) {
    document.getElementById('codeEditor').value = lesson.task.starterCode;
    const key = getLessonKey(state.currentModule, state.currentLesson);
    delete state.code[key];
    saveState();
    document.getElementById('output').innerHTML = '';
    document.getElementById('testResults').classList.remove('show');
  }
}

function showHint() {
  const lesson = courseData[state.currentModule].lessons[state.currentLesson];
  if (lesson.task) {
    alert('💡 Подсказка: внимательно перечитайте условие задачи и теорию выше. Попробуйте разбить задачу на маленькие шаги и решать их по одному.');
  }
}

function resetProgress() {
  if (confirm('Сбросить весь прогресс? Это действие нельзя отменить.')) {
    state.completed = {};
    state.code = {};
    saveState();
    renderSidebar();
    updateProgress();
    loadLesson(0, 0);
  }
}

function showCertificate() {
  const now = new Date();
  const dateStr = now.toLocaleDateString('ru-RU', { year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('certDate').textContent = `Выдан: ${dateStr}`;
  document.getElementById('certModal').classList.add('show');
}

function closeCert() {
  document.getElementById('certModal').classList.remove('show');
}

// ============ ИНИЦИАЛИЗАЦИЯ ============

  document.getElementById('contentArea').innerHTML = `
    <div class="welcome-screen">
      <h1>🐍 Добро пожаловать в PyCamp!</h1>
      <p>Бесплатный интерактивный курс Python с нуля до уверенного уровня. Учитесь в своём темпе, выполняйте задания прямо в браузере и получите сертификат по окончании.</p>
      <button class="btn" onclick="loadLesson(0, 0)" style="font-size: 18px; padding: 14px 32px;">🚀 Начать обучение</button>

// Запуск
renderSidebar();
updateProgress();
if (getCompletedCount() > 0) {
  // Найти первый незавершённый урок
  let found = false;
  for (let m = 0; m < courseData.length && !found; m++) {
    for (let l = 0; l < courseData[m].lessons.length && !found; l++) {
      if (!state.completed[getLessonKey(m, l)]) {
        loadLesson(m, l);
        found = true;
      }
    }
  }
  if (!found) loadLesson(0, 0);
} else {
  showWelcome();
}

// Ctrl+Enter для запуска
document.getElementById('codeEditor').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    checkSolution();
  }
});
</script>
