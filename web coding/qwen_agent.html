<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — бесплатный интерактивный курс Python</title>
<meta name="description" content="PyCamp — аналог freeCodeCamp: полный бесплатный курс Python с интерактивным редактором кода, задачами, тестами и сертификационными проектами.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%8D%3C/text%3E%3C/svg%3E">
<style>
/* ============ ТОКЕНЫ ТЕМЫ ============ */
:root{
  --f-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --sp:16px;
  --header-h:58px;
  --side-w:312px;
  --trans:.18s ease;
}
html[data-theme="dark"]{
  --bg:#0b0e1a; --bg2:#0f1324; --panel:#141a2e; --panel2:#1a2138; --panel3:#212a45;
  --border:#26304f; --border2:#33406a;
  --text:#e8ebf6; --text2:#aab3d0; --text3:#7d87a8;
  --acc:#3ddc84; --acc-d:#22b967; --acc-soft:rgba(61,220,132,.13);
  --gold:#ffd43b; --gold-soft:rgba(255,212,59,.13);
  --blue:#5bc8ff; --blue-soft:rgba(91,200,255,.13);
  --red:#ff6b7d; --red-soft:rgba(255,107,125,.13);
  --violet:#b78cff;
  --code-bg:#0a0d1a; --code-bar:#11162a;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --sel:rgba(61,220,132,.28);
}
html[data-theme="light"]{
  --bg:#f4f6fc; --bg2:#eceffa; --panel:#ffffff; --panel2:#f7f9ff; --panel3:#eef1fb;
  --border:#dde3f2; --border2:#c7d0e8;
  --text:#141a2e; --text2:#4d5878; --text3:#7a85a3;
  --acc:#12a05c; --acc-d:#0d8149; --acc-soft:rgba(18,160,92,.1);
  --gold:#c78a00; --gold-soft:rgba(199,138,0,.12);
  --blue:#0d7fc4; --blue-soft:rgba(13,127,196,.1);
  --red:#d92b45; --red-soft:rgba(217,43,69,.09);
  --violet:#7b4fd0;
  --code-bg:#0e1424; --code-bar:#151d33;
  --shadow:0 8px 24px rgba(20,26,46,.1);
  --sel:rgba(18,160,92,.22);
}
/* ============ БАЗА ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--f-sans);
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
::selection{background:var(--sel)}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
h1,h2,h3,h4{line-height:1.28;margin:0}
/* скроллбары */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--border2);border-radius:20px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--text3);background-clip:content-box;border:3px solid transparent}

/* ============ КАРКАС ============ */
.app{display:grid;grid-template-rows:var(--header-h) 1fr;height:100vh;height:100dvh}
.body-row{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:0}

/* ШАПКА */
.topbar{
  display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--bg2);border-bottom:1px solid var(--border);
  position:relative;z-index:60;
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer;user-select:none}
.brand .logo{width:32px;height:32px;flex:0 0 32px}
.brand .bt{font-weight:800;font-size:18px;letter-spacing:-.4px}
.brand .bt span{color:var(--acc)}
.brand .bs{font-size:10.5px;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;margin-top:-4px}
.icon-btn{
  width:36px;height:36px;border-radius:var(--r-s);border:1px solid var(--border);
  background:var(--panel);color:var(--text2);cursor:pointer;display:grid;place-items:center;
  transition:var(--trans);flex-shrink:0
}
.icon-btn:hover{color:var(--text);border-color:var(--border2);background:var(--panel2)}
.burger{display:none}
.search-wrap{position:relative;flex:1;max-width:520px;margin-left:auto}
.search-wrap input{
  width:100%;height:36px;border-radius:var(--r-s);border:1px solid var(--border);
  background:var(--panel);color:var(--text);padding:0 12px 0 34px;font-size:13.5px;outline:none;transition:var(--trans)
}
.search-wrap input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.search-wrap .si{position:absolute;left:11px;top:9px;color:var(--text3);pointer-events:none}
.search-results{
  position:absolute;top:42px;left:0;right:0;background:var(--panel);border:1px solid var(--border2);
  border-radius:var(--r-m);box-shadow:var(--shadow);max-height:min(60vh,460px);overflow:auto;z-index:80;display:none
}
.search-results.open{display:block}
.sr-item{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--border)}
.sr-item:last-child{border-bottom:0}
.sr-item:hover,.sr-item.sel{background:var(--panel3)}
.sr-item .t{font-weight:600;font-size:13.5px}
.sr-item .s{font-size:11.5px;color:var(--text3)}
.sr-item mark{background:var(--gold-soft);color:var(--gold);border-radius:3px;padding:0 2px}
.sr-empty{padding:16px;color:var(--text3);font-size:13px;text-align:center}
.top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ring-wrap{display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 9px 3px 3px;border-radius:20px;border:1px solid var(--border);background:var(--panel);transition:var(--trans)}
.ring-wrap:hover{border-color:var(--border2);background:var(--panel2)}
.ring-wrap .pct{font-size:12px;font-weight:700;color:var(--text2)}
@media(max-width:1180px){.ring-wrap .pct{display:none}}

/* САЙДБАР */
.sidebar{
  background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;overflow-x:hidden;min-height:0;padding-bottom:30px
}
.side-head{padding:14px 14px 10px;position:sticky;top:0;background:var(--bg2);z-index:5;border-bottom:1px solid var(--border)}
.side-head .tt{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);font-weight:700}
.navlinks{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.navlink{
  font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);
  color:var(--text2);cursor:pointer;background:var(--panel);transition:var(--trans);white-space:nowrap
}
.navlink:hover{color:var(--text);border-color:var(--border2)}
.navlink.active{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.sec{border-bottom:1px solid var(--border)}
.sec-head{
  display:flex;align-items:center;gap:9px;padding:11px 12px;cursor:pointer;user-select:none;
  transition:var(--trans);width:100%;background:none;border:0;text-align:left;color:var(--text)
}
.sec-head:hover{background:var(--panel)}
.sec-head .num{
  width:24px;height:24px;flex:0 0 24px;border-radius:6px;background:var(--panel3);color:var(--text2);
  display:grid;place-items:center;font-size:11px;font-weight:800;border:1px solid var(--border)
}
.sec.done .sec-head .num{background:var(--acc);color:#04120a;border-color:var(--acc)}
.sec-head .st{font-size:13px;font-weight:700;flex:1;line-height:1.3}
.sec-head .bar{width:34px;height:4px;border-radius:4px;background:var(--panel3);overflow:hidden;flex-shrink:0}
.sec-head .bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
.sec-head .chev{color:var(--text3);transition:transform .2s;flex-shrink:0}
.sec.open .sec-head .chev{transform:rotate(90deg)}
.sec-lessons{display:none;padding:0 8px 8px 8px}
.sec.open .sec-lessons{display:block}
.les{
  display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:var(--r-s);cursor:pointer;
  color:var(--text2);font-size:13px;transition:var(--trans);line-height:1.35
}
.les:hover{background:var(--panel);color:var(--text)}
.les.active{background:var(--acc-soft);color:var(--acc);font-weight:600}
.les .dot{width:15px;height:15px;flex:0 0 15px;border-radius:50%;border:1.6px solid var(--border2);display:grid;place-items:center;font-size:9px}
.les.done .dot{background:var(--acc);border-color:var(--acc);color:#04120a}
.les .lt{flex:1;overflow:hidden;text-overflow:ellipsis}
.side-foot{padding:14px 12px;color:var(--text3);font-size:11.5px;line-height:1.5}

/* ОСНОВНАЯ ОБЛАСТЬ */
.main{overflow-y:auto;min-height:0;scroll-behavior:smooth}
.wrap{max-width:1180px;margin:0 auto;padding:26px 30px 80px}
@media(max-width:760px){.wrap{padding:18px 15px 60px}}

.crumbs{font-size:12px;color:var(--text3);display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.crumbs b{color:var(--text2);font-weight:600}
.lesson-head{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.lesson-head h1{font-size:clamp(24px,3.6vw,34px);letter-spacing:-.7px;font-weight:800}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 10px;border-radius:20px;
  background:var(--panel);border:1px solid var(--border);color:var(--text2);font-weight:500
}
.chip.g{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.chip.b{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.chip.y{background:var(--gold-soft);border-color:transparent;color:var(--gold)}

/* ТЕОРИЯ */
.theory{font-size:15.5px;max-width:820px}
.theory h2{font-size:22px;margin:34px 0 12px;letter-spacing:-.3px;padding-top:6px;display:flex;align-items:center;gap:9px}
.theory h2::before{content:"";width:4px;height:20px;background:var(--acc);border-radius:3px;flex-shrink:0}
.theory h3{font-size:17px;margin:24px 0 9px;color:var(--text)}
.theory p{margin:0 0 13px;color:var(--text)}
.theory ul,.theory ol{margin:0 0 14px;padding-left:24px}
.theory li{margin-bottom:6px}
.theory li::marker{color:var(--acc)}
.theory strong{color:var(--text);font-weight:700}
.theory em{color:var(--text2)}
.theory code:not(pre code){
  font-family:var(--f-mono);font-size:.87em;background:var(--panel3);color:var(--gold);
  padding:2px 6px;border-radius:4px;border:1px solid var(--border);white-space:nowrap
}
.theory hr{border:0;border-top:1px solid var(--border);margin:28px 0}
.theory table{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:13.8px;display:block;overflow-x:auto}
.theory th,.theory td{border:1px solid var(--border);padding:8px 11px;text-align:left;vertical-align:top}
.theory th{background:var(--panel2);font-weight:700;color:var(--text);white-space:nowrap}
.theory td code{white-space:nowrap}
.theory tr:nth-child(even) td{background:var(--panel)}

.codeblock{margin:0 0 18px;border:1px solid var(--border);border-radius:var(--r-m);overflow:hidden;background:var(--code-bg)}
.codeblock .cb-bar{
  display:flex;align-items:center;gap:8px;padding:6px 11px;background:var(--code-bar);
  border-bottom:1px solid var(--border);font-size:11.5px;color:#8b96b8
}
.codeblock .cb-bar .fname{font-family:var(--f-mono)}
.codeblock .cb-bar .dots{display:flex;gap:5px;margin-right:4px}
.codeblock .cb-bar .dots i{width:9px;height:9px;border-radius:50%;display:block}
.codeblock .cb-actions{margin-left:auto;display:flex;gap:5px}
.mini-btn{
  font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid #2c3855;background:#1a2340;
  color:#a9b4d4;cursor:pointer;transition:var(--trans);display:inline-flex;align-items:center;gap:4px
}
.mini-btn:hover{background:#243055;color:#fff;border-color:#3b4a75}
.codeblock pre{margin:0;padding:13px 15px;overflow-x:auto;font-family:var(--f-mono);font-size:13.3px;line-height:1.62;color:#dfe6ff}
.codeblock .cb-out{
  border-top:1px solid var(--border);background:#070a14;padding:9px 15px;font-family:var(--f-mono);
  font-size:12.6px;color:#8ce0ab;white-space:pre-wrap;word-break:break-word
}
.codeblock .cb-out::before{content:"▸ вывод";display:block;color:#59648a;font-size:10.5px;letter-spacing:.8px;margin-bottom:3px;text-transform:uppercase}

.callout{
  border-radius:var(--r-m);padding:13px 16px;margin:0 0 18px;border:1px solid;border-left-width:4px;
  font-size:14.3px;background:var(--panel)
}
.callout .ct{font-weight:800;font-size:12px;letter-spacing:.7px;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.callout p:last-child{margin-bottom:0}
.callout.note{border-color:var(--blue);background:var(--blue-soft)}
.callout.note .ct{color:var(--blue)}
.callout.tip{border-color:var(--acc);background:var(--acc-soft)}
.callout.tip .ct{color:var(--acc)}
.callout.warn{border-color:var(--gold);background:var(--gold-soft)}
.callout.warn .ct{color:var(--gold)}
.callout.danger{border-color:var(--red);background:var(--red-soft)}
.callout.danger .ct{color:var(--red)}

/* ПОДСВЕТКА СИНТАКСИСА */
.tok-com{color:#6b7aa8;font-style:italic}
.tok-str{color:#9fe8a2}
.tok-num{color:#ffcb6b}
.tok-kw{color:#ff7ab2;font-weight:600}
.tok-bi{color:#7fd1ff}
.tok-fn{color:#dcd2ff}
.tok-dec{color:#ffd479}
.tok-op{color:#e8ebf6}
.tok-bool{color:#ff9d6b}

/* КВИЗ */
.block-title{
  display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin:38px 0 14px;
  padding-top:20px;border-top:1px solid var(--border);letter-spacing:-.2px
}
.block-title .ic{font-size:20px}
.quiz-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-l);padding:18px;margin-bottom:14px}
.quiz-card .qn{font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:7px}
.quiz-card .qq{font-size:15.5px;font-weight:600;margin-bottom:13px;line-height:1.5}
.quiz-card .qq code{font-family:var(--f-mono);font-size:.88em;background:var(--panel3);padding:2px 6px;border-radius:4px;color:var(--gold)}
.qopt{
  display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--border);
  border-radius:var(--r-m);margin-bottom:7px;cursor:pointer;transition:var(--trans);background:var(--panel2);font-size:14px
}
.qopt:hover{border-color:var(--border2);background:var(--panel3)}
.qopt .k{
  width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:1.6px solid var(--border2);
  display:grid;place-items:center;font-size:10.5px;font-weight:800;color:var(--text3);margin-top:1px
}
.qopt.correct{border-color:var(--acc);background:var(--acc-soft)}
.qopt.correct .k{background:var(--acc);border-color:var(--acc);color:#04120a}
.qopt.wrong{border-color:var(--red);background:var(--red-soft)}
.qopt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
.qopt.locked{cursor:default;opacity:.85}
.qopt code,.qexp code{font-family:var(--f-mono);font-size:.88em;background:var(--panel3);padding:1px 5px;border-radius:4px;color:var(--gold)}
.qexp{
  margin-top:10px;padding:10px 13px;border-radius:var(--r-m);background:var(--panel3);font-size:13.5px;
  color:var(--text2);border-left:3px solid var(--acc);display:none
}
.qexp.show{display:block}

/* ЗАДАЧА / РЕДАКТОР */
.task-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-l);overflow:hidden;margin-bottom:18px}
.task-top{padding:16px 18px;border-bottom:1px solid var(--border);background:var(--panel2)}
.task-top h3{font-size:17px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.task-text{font-size:14.4px;color:var(--text2)}
.task-text p{margin:0 0 9px}
.task-text ul,.task-text ol{margin:0 0 10px;padding-left:22px}
.task-text li{margin-bottom:5px}
.task-text code{font-family:var(--f-mono);font-size:.88em;background:var(--panel3);padding:2px 6px;border-radius:4px;color:var(--gold)}
.task-text strong{color:var(--text)}
.editor-shell{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:1020px){.editor-shell.split{grid-template-columns:1fr 1fr}}
.editor-pane{min-width:0;border-right:1px solid var(--border)}
.pane-bar{
  display:flex;align-items:center;gap:8px;padding:7px 11px;background:var(--code-bar);
  border-bottom:1px solid var(--border);font-size:11.5px;color:#8b96b8;min-height:34px
}
.pane-bar .tt{font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-size:10.5px}
.pane-bar .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.editor{position:relative;background:var(--code-bg);font-family:var(--f-mono);font-size:13.3px;line-height:1.62;overflow:hidden}
.editor .gutter{
  position:absolute;left:0;top:0;bottom:0;width:42px;padding:12px 8px 12px 0;text-align:right;
  color:#4a5578;background:var(--code-bg);border-right:1px solid #1c2440;user-select:none;overflow:hidden;z-index:2;
  font-variant-numeric:tabular-nums
}
.editor .scroller{position:relative;overflow:auto;height:var(--eh,340px);padding-left:42px}
.editor pre.hl,.editor textarea{
  margin:0;padding:12px 14px;font-family:var(--f-mono);font-size:13.3px;line-height:1.62;
  white-space:pre;tab-size:4;word-wrap:normal
}
.editor pre.hl{position:absolute;inset:0 0 auto 42px;pointer-events:none;color:#dfe6ff;min-height:100%;overflow:visible}
.editor textarea{
  position:relative;display:block;width:100%;min-height:100%;background:transparent;color:transparent;
  caret-color:var(--acc);border:0;outline:none;resize:none;overflow:hidden;z-index:1;
  -webkit-text-fill-color:transparent
}
.editor textarea::selection{background:var(--sel);-webkit-text-fill-color:transparent}
.editor.readonly textarea{cursor:default}
.console-pane{background:#070a14;min-width:0;display:flex;flex-direction:column}
.console-out{
  flex:1;overflow:auto;padding:11px 14px;font-family:var(--f-mono);font-size:12.8px;line-height:1.6;
  color:#cdd6f4;white-space:pre-wrap;word-break:break-word;min-height:120px;max-height:var(--ch,340px)
}
.console-out .err{color:#ff8b9a}
.console-out .ok{color:#8ce0ab}
.console-out .dim{color:#5f6b91}
.console-out .sys{color:#7fd1ff}
.console-out img{max-width:100%;border-radius:8px;margin-top:8px;border:1px solid #223}
.task-actions{display:flex;gap:8px;flex-wrap:wrap;padding:11px 14px;border-top:1px solid var(--border);background:var(--panel2);align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:var(--r-s);
  border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13.2px;font-weight:600;
  cursor:pointer;transition:var(--trans);white-space:nowrap
}
.btn:hover{background:var(--panel3);border-color:var(--border2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#04120a}
.btn.primary:hover{background:var(--acc-d);border-color:var(--acc-d)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#241c00}
.btn.gold:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:12.3px}
.btn kbd{font-family:var(--f-mono);font-size:10px;opacity:.65;border:1px solid currentColor;border-radius:3px;padding:0 3px}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.25);border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ТЕСТЫ */
.tests{padding:0}
.test-row{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--border);font-size:13.6px}
.test-row:first-child{border-top:0}
.test-row .ti{width:19px;height:19px;flex:0 0 19px;border-radius:50%;display:grid;place-items:center;font-size:11px;margin-top:1px;font-weight:800}
.test-row.pass .ti{background:var(--acc-soft);color:var(--acc)}
.test-row.fail .ti{background:var(--red-soft);color:var(--red)}
.test-row.wait .ti{background:var(--panel3);color:var(--text3)}
.test-row .td{flex:1;color:var(--text2)}
.test-row.pass .td{color:var(--text)}
.test-row .tm{font-family:var(--f-mono);font-size:11.6px;color:var(--text3);margin-top:3px;white-space:pre-wrap;word-break:break-word}
.verdict{
  padding:13px 16px;border-top:1px solid var(--border);font-size:14px;font-weight:700;display:none;align-items:center;gap:10px
}
.verdict.show{display:flex}
.verdict.ok{background:var(--acc-soft);color:var(--acc)}
.verdict.bad{background:var(--red-soft);color:var(--red)}
.hint-box{display:none;padding:13px 16px;border-top:1px solid var(--border);background:var(--gold-soft);font-size:13.8px;color:var(--text2)}
.hint-box.show{display:block}
.hint-box b{color:var(--gold)}
.hint-box pre{background:var(--code-bg);padding:10px 13px;border-radius:8px;overflow-x:auto;margin:9px 0 0;color:#dfe6ff;font-size:12.8px;line-height:1.55}

/* НАВИГАЦИЯ ПО УРОКАМ */
.lesson-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:34px;max-width:820px}
@media(max-width:640px){.lesson-nav{grid-template-columns:1fr}}
.lnav{
  padding:13px 15px;border:1px solid var(--border);border-radius:var(--r-m);background:var(--panel);
  cursor:pointer;transition:var(--trans);text-align:left;color:var(--text)
}
.lnav:hover{border-color:var(--acc);background:var(--panel2);transform:translateY(-1px)}
.lnav .k{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;font-weight:700}
.lnav .v{font-size:14px;font-weight:600;margin-top:3px}
.lnav.next{text-align:right}
.lnav.disabled{opacity:.4;pointer-events:none}

/* ГЛАВНАЯ / СТРАНИЦЫ */
.hero{
  text-align:center;padding:52px 20px 40px;max-width:860px;margin:0 auto
}
.hero .eyebrow{
  display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--acc);background:var(--acc-soft);padding:5px 14px;border-radius:20px;margin-bottom:20px
}
.hero h1{font-size:clamp(30px,5.4vw,52px);letter-spacing:-1.4px;font-weight:800;line-height:1.12}
.hero h1 .g{background:linear-gradient(100deg,var(--acc),var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:17px;color:var(--text2);margin:18px auto 0;max-width:640px}
.hero .cta{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.btn.lg{padding:12px 24px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:36px auto 0;max-width:760px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-m);padding:16px}
.stat .n{font-size:28px;font-weight:800;color:var(--acc);letter-spacing:-1px}
.stat .l{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;font-weight:600;margin-top:2px}
.curric{max-width:1000px;margin:0 auto;padding:10px 0 40px}
.curric h2{text-align:center;font-size:26px;margin:34px 0 6px;letter-spacing:-.5px}
.curric .sub{text-align:center;color:var(--text3);margin-bottom:26px;font-size:14px}
.sec-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.scard{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r-l);padding:18px;cursor:pointer;
  transition:var(--trans);position:relative;overflow:hidden
}
.scard:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:var(--shadow)}
.scard .ico{font-size:26px;margin-bottom:9px;display:block}
.scard h3{font-size:16.5px;margin-bottom:6px}
.scard p{font-size:13.2px;color:var(--text3);margin:0 0 12px;line-height:1.5}
.scard .foot{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--text3)}
.scard .pbar{flex:1;height:5px;background:var(--panel3);border-radius:5px;overflow:hidden}
.scard .pbar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.scard .cert{position:absolute;top:12px;right:12px;font-size:11px;color:var(--gold);background:var(--gold-soft);padding:2px 8px;border-radius:20px;font-weight:700}

/* СТРАНИЦА ПРОГРЕССА */
.page-head{margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.page-head h1{font-size:clamp(24px,4vw,32px);letter-spacing:-.6px}
.page-head p{color:var(--text3);margin:8px 0 0;font-size:14.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-l);padding:18px}
.card h3{font-size:15.5px;margin-bottom:12px}
.prog-line{display:flex;align-items:center;gap:11px;margin-bottom:11px;font-size:13.4px}
.prog-line .nm{flex:1;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-line .pb{width:96px;height:6px;background:var(--panel3);border-radius:6px;overflow:hidden;flex-shrink:0}
.prog-line .pb i{display:block;height:100%;background:var(--acc)}
.prog-line .pc{width:38px;text-align:right;color:var(--text3);font-size:12px;flex-shrink:0}
.achievements{display:flex;flex-wrap:wrap;gap:9px}
.ach{
  display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;font-size:12.4px;
  background:var(--panel3);color:var(--text3);border:1px solid var(--border)
}
.ach.on{background:var(--gold-soft);color:var(--gold);border-color:transparent;font-weight:600}

/* СЕРТИФИКАТ */
.cert-frame{
  background:linear-gradient(150deg,#101a33,#0b1020);border:1px solid var(--border2);border-radius:var(--r-l);
  padding:8px;max-width:820px;margin:0 auto
}
.cert-inner{
  border:2px solid var(--gold);border-radius:12px;padding:40px 30px;text-align:center;position:relative;
  background:radial-gradient(circle at 50% 0%,rgba(255,212,59,.08),transparent 60%),#0c1224
}
.cert-inner .seal{font-size:44px}
.cert-inner h2{font-size:clamp(22px,4vw,32px);letter-spacing:.5px;margin:8px 0 4px;color:var(--gold)}
.cert-inner .cn{font-size:clamp(24px,5vw,38px);font-weight:800;margin:20px 0;padding:10px;border-bottom:1px dashed var(--border2);border-top:1px dashed var(--border2);letter-spacing:.5px}
.cert-inner p{color:var(--text2);font-size:14.5px;margin:0 auto 10px;max-width:560px}
.cert-inner .dt{margin-top:26px;font-size:12.5px;color:var(--text3);display:flex;justify-content:space-around;flex-wrap:wrap;gap:14px}
.cert-inner .dt b{display:block;color:var(--text);font-size:13.5px;margin-top:3px}
input.inp,select.inp{
  height:38px;border-radius:var(--r-s);border:1px solid var(--border);background:var(--panel2);color:var(--text);
  padding:0 12px;font-size:14px;outline:none;font-family:inherit;transition:var(--trans)
}
input.inp:focus,select.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
label.lbl{font-size:12px;color:var(--text3);font-weight:600;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}

/* ШПАРГАЛКА */
.cheat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
.cheat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-m);overflow:hidden}
.cheat-card h4{padding:11px 14px;background:var(--panel2);border-bottom:1px solid var(--border);font-size:13.5px;margin:0}
.cheat-card .rows{padding:6px 0}
.cheat-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px;padding:5px 14px;font-size:12.6px;align-items:baseline}
.cheat-row:nth-child(odd){background:var(--panel2)}
.cheat-row code{font-family:var(--f-mono);color:var(--acc);word-break:break-word}
.cheat-row span{color:var(--text3)}

/* ПЕСОЧНИЦА */
.play-shell{display:grid;gap:14px}
.play-editor .editor .scroller{height:calc(100vh - 320px);min-height:300px}
.play-console .console-out{max-height:none;height:220px}

/* УВЕДОМЛЕНИЯ / МОДАЛКИ */
.toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{
  background:var(--panel);border:1px solid var(--border2);border-left:4px solid var(--acc);border-radius:var(--r-m);
  padding:11px 16px;box-shadow:var(--shadow);font-size:13.6px;max-width:340px;animation:tin .25s ease;pointer-events:auto
}
.toast.err{border-left-color:var(--red)}
.toast.gold{border-left-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.modal-bg{
  position:fixed;inset:0;background:rgba(4,6,14,.72);backdrop-filter:blur(3px);z-index:300;
  display:none;align-items:center;justify-content:center;padding:20px
}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r-l);max-width:520px;width:100%;padding:24px;box-shadow:var(--shadow);max-height:86vh;overflow:auto}
.modal h3{font-size:19px;margin-bottom:10px}
.modal p{color:var(--text2);font-size:14px;margin:0 0 16px}
.modal .acts{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none}
.scrim.open{display:block}

/* СТАТУС ИНТЕРПРЕТАТОРА */
.py-status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text3);padding:8px 14px;border-top:1px solid var(--border);background:var(--panel2)}
.py-status .led{width:8px;height:8px;border-radius:50%;background:var(--text3);flex-shrink:0}
.py-status .led.load{background:var(--gold);animation:pulse 1.1s infinite}
.py-status .led.ok{background:var(--acc)}
.py-status .led.bad{background:var(--red)}
@keyframes pulse{50%{opacity:.25}}
.offline-note{
  margin:0 0 18px;padding:12px 15px;border-radius:var(--r-m);background:var(--gold-soft);border:1px solid transparent;
  font-size:13.4px;color:var(--text2);display:none
}
.offline-note.show{display:block}
.offline-note b{color:var(--gold)}

footer.site{border-top:1px solid var(--border);padding:24px 30px;color:var(--text3);font-size:12.8px;text-align:center;background:var(--bg2)}
footer.site a{color:var(--text2)}

/* МОБИЛЬНАЯ ВЕРСИЯ */
@media(max-width:980px){
  .body-row{grid-template-columns:1fr}
  .sidebar{
    position:fixed;top:var(--header-h);bottom:0;left:0;width:min(320px,86vw);z-index:55;
    transform:translateX(-102%);transition:transform .24s ease;box-shadow:var(--shadow)
  }
  .sidebar.open{transform:none}
  .burger{display:grid}
  .brand .bs{display:none}
  .wrap{padding:18px 15px 60px}
  .editor-shell.split{grid-template-columns:1fr}
  .editor-pane{border-right:0;border-bottom:1px solid var(--border)}
}
@media(max-width:560px){
  .search-wrap{max-width:none}
  .topbar{gap:8px;padding:0 10px}
  .brand .bt{font-size:16px}
  .hero{padding:30px 8px 24px}
}
@media print{
  .topbar,.sidebar,.toasts,.task-actions,.lesson-nav,.no-print{display:none!important}
  body{overflow:visible;background:#fff;color:#000}
  .app,.body-row,.main{display:block;height:auto;overflow:visible}
  .cert-frame{border:0;background:#fff}
}
.hidden{display:none!important}
.fade-in{animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>

      <input id="search" type="search" placeholder="Поиск по урокам…  ( / )" autocomplete="off" aria-label="Поиск по урокам">

  <div class="body-row">

      <div class="side-head">
        <div class="tt">Программа курса</div>

        Прогресс сохраняется в браузере.<br>

</div>

<script id="course-data" type="application/json">{"course":[{"id":"basics","title":"Основы Python","desc":"Первые шаги: как работает Python, print, переменные, типы данных, числа, строки, ввод и логические выражения.","icon":"🐍","lessons":[{"id":"what-is-python","title":"Что такое Python и как он работает","time":8,"theory":"<p><strong>Python<\/strong> — один из самых популярных языков программирования в мире. Его придумал Гвидо ван Россум\nв конце 1980-х, а первая версия вышла в 1991 году. Главная идея языка — <em>читаемость<\/em>: код на Python похож\nна упрощённый английский текст, поэтому его так часто выбирают первым языком.<\/p>\n\n<h2>Зачем нужен Python<\/h2>\n<ul>\n  <li><strong>Веб-разработка<\/strong> — Django, Flask, FastAPI работают на половине крупных сервисов;<\/li>\n  <li><strong>Анализ данных и ML<\/strong> — NumPy, Pandas, PyTorch, TensorFlow;<\/li>\n  <li><strong>Автоматизация<\/strong> — скрипты, боты, парсеры, обработка файлов;<\/li>\n  <li><strong>Backend и DevOps<\/strong> — API, очереди, инфраструктура, тестирование;<\/li>\n  <li><strong>Обучение алгоритмам<\/strong> — лаконичный синтаксис не отвлекает от сути.<\/li>\n<\/ul>\n\n<h2>Код → интерпретатор → результат<\/h2>\n<p>Программа — это просто текст. Сам по себе текст ничего не делает: его должен прочитать и выполнить\n<strong>интерпретатор<\/strong> — программа, которая переводит твой код в действия процессора.<\/p>\n<pre data-lang=\"text\"><code>твой код (main.py)\n      │\n      ▼\nинтерпретатор CPython\n      │  читает строку за строкой\n      ▼\nбайт-код → виртуальная машина → результат<\/code><\/pre>\n<p>В отличие от C++ или Rust, Python не создаёт отдельный исполняемый файл заранее: интерпретатор разбирает код\n<em>во время запуска<\/em>. Отсюда и главный компромисс языка — удобство в обмен на скорость.<\/p>\n\n<div class=\"callout note\"><div class=\"ct\">ℹ️ А как это работает здесь, в браузере?<\/div>\n<p>В PyCamp используется <strong>Pyodide<\/strong> — настоящий CPython, скомпилированный в WebAssembly.\nТот же самый интерпретатор, что стоит на твоём компьютере, только работает внутри вкладки браузера.\nПоэтому всё, что ты запускаешь в уроках, — это реальный Python, а не имитация.<\/p><\/div>\n\n<h2>Синтаксис и отступы<\/h2>\n<p>В Python нет фигурных скобок для блоков кода. Роль «скобок» играют <strong>отступы<\/strong> — обычно 4 пробела.\nЭто не вкусовщина, а правило языка: неверный отступ = ошибка <code>IndentationError<\/code>.<\/p>\n<pre><code>if 5 &gt; 3:\n    print(\"пять больше трёх\")   # эта строка внутри условия — отступ 4 пробела\nprint(\"а эта уже снаружи\")      # отступа нет — строка выполнится всегда<\/code><\/pre>\n<div class=\"cb-out\">пять больше трёх\nа эта уже снаружи<\/div>\n\n<p>Кроме отступов, важно помнить три вещи:<\/p>\n<ul>\n  <li>регистр имеет значение: <code>Print<\/code> и <code>print<\/code> — разные имена;<\/li>\n  <li>инструкция <code>#<\/code> начинает комментарий — интерпретатор его игнорирует;<\/li>\n  <li>одна строка = одна законченная инструкция (если не сказано обратное).<\/li>\n<\/ul>\n\n<h2>Философия языка<\/h2>\n<p>В Python встроен «манифест» — <em>Дзен Python<\/em>. Его можно напечатать одной командой:<\/p>\n<pre><code>import this<\/code><\/pre>\n<p>Две строки из него стоит запомнить сразу: <em>«Красивое лучше, чем уродливое»<\/em> и\n<em>«Читаемость имеет значение»<\/em>. Хороший код на Python пишут не для интерпретатора, а для людей,\nкоторые будут его читать через год.<\/p>\n\n<div class=\"callout tip\"><div class=\"ct\">🎯 Как проходить уроки<\/div>\n<p>Каждый урок состоит из трёх частей: <strong>теория<\/strong> (читаешь и пробуешь примеры),\n<strong>квиз<\/strong> (проверяешь понимание) и <strong>практика<\/strong> (пишешь код в редакторе, нажимаешь\n«Проверить решение» — тесты сами скажут, верно ли). Не переходи дальше, пока задача не позеленеет:\nв программировании навык строится только из написанного кода.<\/p><\/div>","level":"старт","goal":"Понять, что происходит, когда ты запускаешь код, и как устроены уроки PyCamp.","quiz":[{"q":"Что делает интерпретатор Python?","options":["Переводит весь код в машинные инструкции заранее и сохраняет .exe файл","Читает и выполняет код во время запуска программы","Проверяет код на ошибки и отказывается его запускать","Преобразует код в HTML-страницу"],"answer":1,"explain":"Python — интерпретируемый язык: CPython выполняет инструкции по мере чтения программы, отдельного шага компиляции в исполняемый файл нет."},{"q":"Что произойдёт, если во второй строке блока <code>if<\/code> поставить 2 пробела вместо 4?","options":["Ничего, отступы в Python игнорируются","Код выполнится, но интерпретатор выведет предупреждение","Возникнет ошибка <code>IndentationError<\/code>","Строка будет воспринята как комментарий"],"answer":2,"explain":"Отступы в Python определяют структуру блоков. Важно, чтобы все строки одного блока имели одинаковый отступ."}],"task":{"title":"Первая встреча","text":"<p>Запусти код в редакторе и посмотри на вывод — так работает настоящий Python прямо в браузере.<\/p>\n    <p>Затем <strong>допиши<\/strong> программу: пусть она напечатает ещё одну строку с твоим ответом на вопрос\n    «зачем мне Python?». Итого должно получиться 3 строки вывода.<\/p>","starter":"import this   # убери или оставь — это «Дзен Python»\n\nprint(\"Привет, Python!\")\nprint(\"Я учусь программировать\")\n# допиши третью строку здесь\n","tests":[{"d":"Программа выводит не меньше трёх строк","c":"assert len([l for l in LINES if l.strip()]) >= 3, f'получено строк: {len(LINES)}'"},{"d":"Первая строка вывода — «Привет, Python!»","c":"assert LINES and LINES[0].strip() == 'Привет, Python!'"},{"d":"Использована функция <code>print()<\/code>","s":"print\\s*\\("},{"d":"В коде нет <code>import this<\/code> (иначе вывод засоряется)","s":"^(?![\\s\\S]*import\\s+this)[\\s\\S]*$"}],"hint":["Функция print() выводит одну строку. Скопируй любую строку выше и поменяй текст в кавычках.","Кавычки могут быть одинарными или двойными — главное, чтобы они совпадали."],"hintCode":"print(\"Мой ответ здесь\")","solution":"print(\"Привет, Python!\")\nprint(\"Я учусь программировать\")\nprint(\"Хочу автоматизировать рутину и писать ботов\")\n"}},{"id":"print-output","title":"print(), комментарии и формат вывода","time":12,"theory":"<p>Функция <code>print()<\/code> — твой главный инструмент обратной связи. Она принимает любое количество\nаргументов, превращает их в строки и отправляет в консоль.<\/p>\n\n<pre><code>print(\"Привет\")            # одна строка\nprint(\"Python\", 2026, True) # несколько значений через пробел\nprint()                     # пустая строка<\/code><\/pre>\n<div class=\"cb-out\">Привет\nPython 2026 True\n<\/div>\n\n<h2>Секретные аргументы print<\/h2>\n<p>У <code>print<\/code> есть два необязательных параметра, которые меняют всё:<\/p>\n<table>\n<tr><th>Параметр<\/th><th>По умолчанию<\/th><th>Что делает<\/th><\/tr>\n<tr><td><code>sep<\/code><\/td><td><code>' '<\/code><\/td><td>разделитель между аргументами<\/td><\/tr>\n<tr><td><code>end<\/code><\/td><td><code>'\\n'<\/code><\/td><td>что напечатать в конце (вместо перевода строки)<\/td><\/tr>\n<\/table>\n\n<pre><code>print(\"a\", \"b\", \"c\", sep=\"-\")\nprint(\"1\", \"2\", \"3\", sep=\"\")\nprint(\"Загрузка\", end=\"\")\nprint(\"... готово\")\nprint(\"строка1\", \"строка2\", sep=\"\\n\")<\/code><\/pre>\n<div class=\"cb-out\">a-b-c\n123\nЗагрузка... готово\nстрока1\nстрока2<\/div>\n\n<h2>Управляющие последовательности<\/h2>\n<p>Внутри строк работают специальные символы с обратным слэшем:<\/p>\n<table>\n<tr><th>Символ<\/th><th>Значение<\/th><\/tr>\n<tr><td><code>\\n<\/code><\/td><td>новая строка<\/td><\/tr>\n<tr><td><code>\\t<\/code><\/td><td>табуляция<\/td><\/tr>\n<tr><td><code>\\\\<\/code><\/td><td>сам обратный слэш<\/td><\/tr>\n<tr><td><code>\\\"<\/code> или <code>\\'<\/code><\/td><td>кавычка внутри строки<\/td><\/tr>\n<\/table>\n<pre><code>print(\"Путь: C:\\\\Users\\\\admin\")\nprint('Он сказал: \"Привет!\"')\nprint(\"1\\t2\\t3\")\nprint(\"первая\\nвторая\")<\/code><\/pre>\n<div class=\"cb-out\">Путь: C:\\Users\\admin\nОн сказал: \"Привет!\"\n1\t2\t3\nпервая\nвторая<\/div>\n\n<h2>Комментарии<\/h2>\n<p>Всё, что идёт после <code>#<\/code> до конца строки, интерпретатор игнорирует. Комментарии нужны не для\nмашины, а для человека — объясняй <em>зачем<\/em>, а не <em>что<\/em>.<\/p>\n<pre><code># расчёт скидки по акции\nprice = 1000\ndiscount = 0.2        # 20 % — действует до конца недели\ntotal = price * (1 - discount)\n# print(total)        ← закомментированный код, чтобы не мешал<\/code><\/pre>\n\n<div class=\"callout warn\"><div class=\"ct\">⚠ Частые ошибки новичка<\/div>\n<ul>\n<li>забытая кавычка или запятая → <code>SyntaxError<\/code>;<\/li>\n<li>кириллические скобки и кавычки «ёлочки» из чата → <code>SyntaxError<\/code>;<\/li>\n<li>пробел перед <code>print<\/code> в начале файла → <code>IndentationError<\/code>;<\/li>\n<li><code>print<\/code> без скобок (синтаксис Python 2) → <code>SyntaxError<\/code>.<\/li>\n<\/ul><\/div>\n\n<h2>Как читать сообщения об ошибках<\/h2>\n<p>Ошибка — не провал, а подсказка. Python всегда пишет <strong>тип ошибки<\/strong> и <strong>номер строки<\/strong>:<\/p>\n<pre data-lang=\"text\"><code>Traceback (most recent call last):\n  Строка 3, in &lt;module&gt;\nNameError: name 'pritn' is not defined<\/code><\/pre>\n<p>Читай снизу вверх: последняя строка говорит, <em>что<\/em> случилось (<code>NameError<\/code> — имя не найдено,\nздесь опечатка в названии функции), а строка выше — <em>где<\/em>.<\/p>","level":"старт","goal":"Научиться выводить данные в консоль так, как нужно тебе.","quiz":[{"q":"Что напечатает <code>print('a', 'b', sep='*')<\/code>?","options":["ab","a*b","a b","*ab*"],"answer":1,"explain":"Параметр sep задаёт разделитель между аргументами вместо пробела."},{"q":"Чем закончится <code>print('x', end='!')<br>print('y')<\/code>?","options":["x!y","x! y","x!<br>y (две строки)","Ошибка синтаксиса"],"answer":0,"explain":"end='!' отменяет перевод строки после первого print, поэтому y печатается следом: x!y"},{"q":"Какой символ нужно написать, чтобы получить в выводе один обратный слэш <code>\\<\/code>?","options":["\\","\\\\","\\s","/"],"answer":1,"explain":"Обратный слэш — управляющий символ, поэтому его нужно экранировать вторым таким же: '\\\\'."}],"task":{"title":"Форматированный чек","text":"<p>Напиши программу, которая печатает чек магазина в три строки ровно в таком виде:<\/p>\n<pre><code>Товар;Цена;Кол-во\nКофе;350;2\nИтого: 700 руб.<\/code><\/pre>\n<p>Первую строку нужно получить <strong>одним<\/strong> вызовом <code>print()<\/code> с аргументом <code>sep<\/code>.\nВо второй строке используй арифметику (<code>350 * 2<\/code>), а не готовое число.<\/p>","starter":"# 1) заголовок через sep=\";\"\n# 2) строка товара: название, цена, количество\n# 3) итог: \"Итого: 700 руб.\"\n","tests":[{"d":"Первая строка вывода: <code>Товар;Цена;Кол-во<\/code>","c":"assert LINES[0] == 'Товар;Цена;Кол-во', repr(LINES[0])"},{"d":"Вторая строка вывода: <code>Кофе;350;2<\/code>","c":"assert LINES[1] == 'Кофе;350;2', repr(LINES[1])"},{"d":"Третья строка: <code>Итого: 700 руб.<\/code>","c":"assert LINES[2] == 'Итого: 700 руб.', repr(LINES[2])"},{"d":"В коде используется параметр <code>sep<\/code>","s":"sep\\s*="},{"d":"Цена умножается, а не написана готовым числом","s":"350\\s*\\*\\s*2"}],"hint":["print('Товар', 'Цена', 'Кол-во', sep=';')","Для итога используй f-строку или склейку: print('Итого:', 350 * 2, 'руб.')","Обрати внимание: между числом и «руб.» должен быть ровно один пробел."],"solution":"print(\"Товар\", \"Цена\", \"Кол-во\", sep=\";\")\nprint(\"Кофе\", 350, 2, sep=\";\")\nprint(\"Итого:\", 350 * 2, \"руб.\")\n"}},{"id":"variables","title":"Переменные и типы данных","time":15,"theory":"<p><strong>Переменная<\/strong> — это имя, за которым закреплёно значение. Присваивание делается знаком <code>=<\/code>\n(читается как «положи в коробку»):<\/p>\n<pre><code>name = \"Аня\"        # строка\nage = 24            # целое число\nheight = 1.68       # дробное число\nis_student = True   # логическое значение\nprint(name, age, height, is_student)<\/code><\/pre>\n<div class=\"cb-out\">Аня 24 1.68 True<\/div>\n\n<p>В отличие от многих языков, тип объявлять не нужно: Python сам понимает его из значения\nи запоминает вместе с объектом. Проверить тип можно функцией <code>type()<\/code>:<\/p>\n<pre><code>x = 42\nprint(type(x))          # &lt;class 'int'&gt;\nx = \"сорок два\"\nprint(type(x))          # &lt;class 'str'&gt; — переменную можно «переодеть»<\/code><\/pre>\n\n<h2>Четыре базовых типа<\/h2>\n<table>\n<tr><th>Тип<\/th><th>Название<\/th><th>Примеры<\/th><th>Изменяемый?<\/th><\/tr>\n<tr><td><code>int<\/code><\/td><td>целое число<\/td><td><code>0, 7, -13, 10**100<\/code><\/td><td>нет<\/td><\/tr>\n<tr><td><code>float<\/code><\/td><td>дробное число<\/td><td><code>3.14, -0.5, 1e6<\/code><\/td><td>нет<\/td><\/tr>\n<tr><td><code>str<\/code><\/td><td>строка<\/td><td><code>\"привет\", 'мир'<\/code><\/td><td>нет<\/td><\/tr>\n<tr><td><code>bool<\/code><\/td><td>логический<\/td><td><code>True, False<\/code><\/td><td>нет<\/td><\/tr>\n<\/table>\n<p>Позже мы добавим к ним коллекции: <code>list<\/code>, <code>tuple<\/code>, <code>set<\/code>, <code>dict<\/code> — они изменяемые.<\/p>\n\n<h2>Правила именования<\/h2>\n<ul>\n  <li>только буквы, цифры и <code>_<\/code>, но <strong>не цифра в начале<\/strong>: <code>user2<\/code> ✓, <code>2user<\/code> ✗;<\/li>\n  <li>регистр важен: <code>Total<\/code> и <code>total<\/code> — разные переменные;<\/li>\n  <li>нельзя использовать зарезервированные слова: <code>if, for, class, return, None, True, import<\/code>…<\/li>\n  <li>принят стиль <code>snake_case<\/code>: <code>user_age<\/code>, <code>total_price<\/code>;<\/li>\n  <li>имя должно говорить о содержимом: <code>price<\/code> лучше, чем <code>p<\/code> или <code>x1<\/code>.<\/li>\n<\/ul>\n\n<pre><code># так делать не стоит\na = 1500\nb = a * 0.8\n# а так — понятно даже через год\nprice = 1500\nprice_with_discount = price * 0.8<\/code><\/pre>\n\n<h2>Переменные — это ссылки<\/h2>\n<p>Переменная не «хранит» значение, а <strong>ссылается<\/strong> на объект в памяти. Поэтому присваивание\nне копирует данные:<\/p>\n<pre><code>a = [1, 2, 3]\nb = a           # b указывает на ТОТ ЖЕ список\nb.append(4)\nprint(a)        # [1, 2, 3, 4] — изменился и a!<\/code><\/pre>\n<div class=\"cb-out\">[1, 2, 3, 4]<\/div>\n<p>Для неизменяемых типов (<code>int<\/code>, <code>str<\/code>) это незаметно, а вот со списками и словарями — источник\nклассических багов. Копию создают так: <code>b = a.copy()<\/code> или <code>b = a[:]<\/code>.<\/p>\n\n<h2>Множественное присваивание и обмен<\/h2>\n<pre><code>x, y = 1, 2          # сразу две переменные\nx, y = y, x          # обмен значениями без третьей переменной!\na = b = c = 0        # одно значение в три переменные\nprint(x, y, a, b, c)<\/code><\/pre>\n<div class=\"cb-out\">2 1 0 0 0<\/div>\n\n<h2>Динамическая типизация: польза и ловушки<\/h2>\n<pre><code>value = \"10\"\n# print(value + 5)   # TypeError: нельзя сложить строку и число\nvalue = int(value)   # явное преобразование\nprint(value + 5)<\/code><\/pre>\n<div class=\"cb-out\">15<\/div>\n<div class=\"callout danger\"><div class=\"ct\">⛔ TypeError — самая частая ошибка новичка<\/div>\n<p>Python не складывает строки с числами автоматически. <code>\"Итого: \" + 100<\/code> → ошибка.\nНужно либо преобразовать: <code>\"Итого: \" + str(100)<\/code>, либо использовать f-строку:\n<code>f\"Итого: {100}\"<\/code>.<\/p><\/div>\n\n<h2>None — «ничего»<\/h2>\n<p>Специальное значение <code>None<\/code> означает отсутствие данных. Его часто возвращают функции,\nкоторые ничего не вернули явно:<\/p>\n<pre><code>result = print(\"привет\")   # print печатает и возвращает None\nprint(result, type(result))<\/code><\/pre>\n<div class=\"cb-out\">привет\nNone &lt;class 'NoneType'&gt;<\/div>","level":"старт","goal":"Научиться хранить данные в переменных и понимать, чем отличаются типы.","quiz":[{"q":"Что выведет <code>x = 5<br>x = 'пять'<br>print(type(x))<\/code>?","options":["&lt;class 'int'&gt;","&lt;class 'str'&gt;","Ошибка: тип переменной нельзя менять","None"],"answer":1,"explain":"Типизация в Python динамическая: переменная может ссылаться на объект любого типа, тип определяется текущим значением."},{"q":"Дано: <code>a = [1, 2]<\/code>, <code>b = a<\/code>, <code>b.append(3)<\/code>. Что в <code>a<\/code>?","options":["[1, 2]","[1, 2, 3]","[3]","Ошибка"],"answer":1,"explain":"b и a ссылаются на один и тот же список, поэтому изменение через b видно и через a."},{"q":"Какое имя переменной недопустимо в Python?","options":["_total","total_2","2total","totalPrice"],"answer":2,"explain":"Имя не может начинаться с цифры. Остальные варианты корректны (хотя totalPrice противорчит стилю PEP 8)."}],"task":{"title":"Карточка пользователя","text":"<p>Создай переменные для карточки пользователя и выведи их в консоль:<\/p>\n<ul>\n<li><code>name<\/code> — строка с именем;<\/li>\n<li><code>age<\/code> — целое число;<\/li>\n<li><code>height<\/code> — дробное число (метры);<\/li>\n<li><code>is_admin<\/code> — логическое значение.<\/li>\n<\/ul>\n<p>Первая строка вывода должна быть <code>Имя: &lt;твоё имя&gt;<\/code>, вторая — <code>Возраст: &lt;число&gt;<\/code>.\nДальше выведи типы всех четырёх переменных через <code>type()<\/code>.<\/p>","starter":"# создай четыре переменные\n\n\n# выведи \"Имя: ...\" и \"Возраст: ...\"\n\n# выведи типы переменных\n","tests":[{"d":"Создана переменная <code>name<\/code> типа <code>str<\/code>","c":"assert isinstance(name, str) and name"},{"d":"Создана переменная <code>age<\/code> типа <code>int<\/code>","c":"assert isinstance(age, int) and not isinstance(age, bool)"},{"d":"Создана переменная <code>height<\/code> типа <code>float<\/code>","c":"assert isinstance(height, float)"},{"d":"Создана переменная <code>is_admin<\/code> типа <code>bool<\/code>","c":"assert isinstance(is_admin, bool)"},{"d":"Первая строка вывода начинается с <code>Имя:<\/code>","c":"assert LINES[0].startswith('Имя: '), repr(LINES[0])"},{"d":"Вторая строка вывода начинается с <code>Возраст:<\/code>","c":"assert LINES[1].startswith('Возраст: '), repr(LINES[1])"},{"d":"Выведены типы переменных","c":"assert \"<class 'int'>\" in OUTPUT and \"<class 'str'>\" in OUTPUT"}],"hint":["Для строки вывода используй print('Имя:', name) — аргументы разделятся пробелом автоматически.","Типы можно вывести одним вызовом: print(type(name), type(age), type(height), type(is_admin))"],"solution":"name = \"Аня\"\nage = 24\nheight = 1.68\nis_admin = False\n\nprint(\"Имя:\", name)\nprint(\"Возраст:\", age)\nprint(type(name), type(age), type(height), type(is_admin))\n"}},{"id":"numbers","title":"Числа и арифметика","time":14,"theory":"<h2>Арифметические операторы<\/h2>\n<table>\n<tr><th>Оператор<\/th><th>Действие<\/th><th>Пример<\/th><th>Результат<\/th><\/tr>\n<tr><td><code>+<\/code><\/td><td>сложение<\/td><td><code>7 + 2<\/code><\/td><td>9<\/td><\/tr>\n<tr><td><code>-<\/code><\/td><td>вычитание<\/td><td><code>7 - 2<\/code><\/td><td>5<\/td><\/tr>\n<tr><td><code>*<\/code><\/td><td>умножение<\/td><td><code>7 * 2<\/code><\/td><td>14<\/td><\/tr>\n<tr><td><code>/<\/code><\/td><td>деление (всегда float)<\/td><td><code>7 / 2<\/code><\/td><td>3.5<\/td><\/tr>\n<tr><td><code>//<\/code><\/td><td>целочисленное деление<\/td><td><code>7 // 2<\/code><\/td><td>3<\/td><\/tr>\n<tr><td><code>%<\/code><\/td><td>остаток от деления<\/td><td><code>7 % 2<\/code><\/td><td>1<\/td><\/tr>\n<tr><td><code>**<\/code><\/td><td>возведение в степень<\/td><td><code>7 ** 2<\/code><\/td><td>49<\/td><\/tr>\n<\/table>\n\n<pre><code>print(10 / 4, 10 // 4, 10 % 4)\nprint(2 ** 10, 9 ** 0.5)\nprint(-7 // 2, -7 % 2)     # округление вниз!<\/code><\/pre>\n<div class=\"cb-out\">2.5 2 2\n1024 3.0\n-4 1<\/div>\n\n<div class=\"callout warn\"><div class=\"ct\">⚠ Обрати внимание<\/div>\n<p>Оператор <code>/<\/code> всегда возвращает <code>float<\/code>, даже если делится нацело: <code>10 / 5 == 2.0<\/code>.\nА <code>//<\/code> округляет <strong>вниз<\/strong> (к минус бесконечности), поэтому <code>-7 // 2<\/code> даёт <code>-4<\/code>, а не <code>-3<\/code>.<\/p><\/div>\n\n<h2>Остаток и целая часть — рабочие лошадки<\/h2>\n<p>Пара <code>//<\/code> и <code>%<\/code> решает десятки бытовых задач:<\/p>\n<pre><code>seconds = 3725\nh = seconds // 3600\nm = (seconds % 3600) // 60\ns = seconds % 60\nprint(f\"{h} ч {m} мин {s} с\")\n\nn = 17\nprint(\"чётное\" if n % 2 == 0 else \"нечётное\")\n\nmoney = 250\nprint(\"купюр по 100:\", money // 100, \"остаток:\", money % 100)<\/code><\/pre>\n<div class=\"cb-out\">1 ч 2 мин 5 с\nнечётное\nкупюр по 100: 2 остаток: 50<\/div>\n\n<h2>Приоритет операций<\/h2>\n<p>Как в математике: сначала <code>**<\/code>, затем <code>* / // %<\/code>, потом <code>+ -<\/code>.\nСомневаешься — ставь скобки, они бесплатны и улучшают читаемость.<\/p>\n<pre><code>print(2 + 3 * 4)       # 14\nprint((2 + 3) * 4)     # 20\nprint(2 ** 3 ** 2)     # 512 — степень правоассоциативна: 2 ** (3 ** 2)<\/code><\/pre>\n<div class=\"cb-out\">14\n20\n512<\/div>\n\n<h2>Сокращённые операции<\/h2>\n<pre><code>count = 0\ncount += 1     # count = count + 1\ncount *= 5     # count = count * 5\ncount -= 2     # count = count - 2\ncount //= 3    # count = count // 3\nprint(count)   # 1<\/code><\/pre>\n<div class=\"cb-out\">1<\/div>\n<p>В Python нет <code>count++<\/code> — используй <code>count += 1<\/code>.<\/p>\n\n<h2>Функции для чисел<\/h2>\n<pre><code>print(round(3.14159, 2))   # 3.14 — округление до 2 знаков\nprint(round(2.5), round(3.5))  # 2 и 4 — «банковское» округление к чётному\nprint(abs(-7), max(1, 5, 3), min(1, 5, 3), sum([1, 2, 3]))\nprint(int(\"42\") + 1, float(\"3.5\") * 2)\nprint(divmod(17, 5))       # (3, 2) — частное и остаток сразу<\/code><\/pre>\n<div class=\"cb-out\">3.14\n2 4\n7 5 1 6\n43 7.0\n(3, 2)<\/div>\n\n<h2>Почему 0.1 + 0.2 != 0.3<\/h2>\n<pre><code>print(0.1 + 0.2)                 # 0.30000000000000004\nprint(0.1 + 0.2 == 0.3)          # False\nprint(round(0.1 + 0.2, 10) == 0.3)  # True — сравнивай с допуском<\/code><\/pre>\n<div class=\"cb-out\">0.30000000000000004\nFalse\nTrue<\/div>\n<p>Дробные числа хранятся в двоичном виде, и некоторые десятичные дроби (как 0.1) не представляются точно.\nДля денег используют целые копейки, <code>round()<\/code> или модуль <code>decimal<\/code>.<\/p>\n\n<h2>Большие числа и разделители<\/h2>\n<pre><code>print(2 ** 100)              # Python не переполняется\nprint(1_000_000 + 1)         # подчёркивания для читаемости\nprint(0xFF, 0b1010, 0o17)    # 255 10 15\nprint(f\"{1234567:,}\")        # 1,234,567<\/code><\/pre>\n<div class=\"cb-out\">1267650600228229401496703205376\n1000001\n255 10 15\n1,234,567<\/div>","level":"старт","goal":"Освоить арифметические операторы, округление и особенности дробных чисел.","quiz":[{"q":"Чему равно <code>17 // 5<\/code> и <code>17 % 5<\/code>?","options":["3.4 и 2","3 и 2","2 и 3","3 и 0.4"],"answer":1,"explain":"// даёт целую часть (3), % — остаток (17 - 3*5 = 2)."},{"q":"Что выведет <code>print(10 / 5)<\/code>?","options":["2","2.0","5","Ошибка"],"answer":1,"explain":"Оператор / всегда возвращает float, даже при делении нацело."},{"q":"Почему <code>0.1 + 0.2 == 0.3<\/code> даёт False?","options":["В Python ошибка в арифметике","Числа сравниваются по типу","Двоичное представление 0.1 и 0.2 неточно, сумма не равна 0.3 бит-в-бит","Нужно писать 0.1 + 0.2 === 0.3"],"answer":2,"explain":"float хранится в двоичной системе, где 0.1 — бесконечная периодическая дробь. Сравнивать float нужно с допуском или через math.isclose()."}],"task":{"title":"Конвертер секунд","text":"<p>Дано количество секунд в переменной <code>total_seconds = 7384<\/code>.\nРазложи его на часы, минуты и секунды и выведи <strong>одну<\/strong> строку вида:<\/p>\n<pre><code>7384 сек = 2 ч 3 мин 4 сек<\/code><\/pre>\n<p>Числа должны быть вычислены, а не вписаны вручную. Ниже выведи проверку:\n<code>2 ч 3 мин 4 сек обратно: 7384<\/code> — то есть собери секунды из частей и убедись, что значение совпало.<\/p>","starter":"total_seconds = 7384\n\n# вычисли hours, minutes, seconds\n\n\n# выведи результат в одну строку\n\n\n# обратная проверка\n","tests":[{"d":"Переменная <code>hours<\/code> равна 2","c":"assert hours == 2, hours"},{"d":"Переменная <code>minutes<\/code> равна 3","c":"assert minutes == 3, minutes"},{"d":"Переменная <code>seconds<\/code> равна 4","c":"assert seconds == 4, seconds"},{"d":"Первая строка вывода: <code>7384 сек = 2 ч 3 мин 4 сек<\/code>","c":"assert LINES[0] == '7384 сек = 2 ч 3 мин 4 сек', repr(LINES[0])"},{"d":"Вторая строка подтверждает обратный расчёт","c":"assert LINES[1].endswith('обратно: 7384'), repr(LINES[1])"},{"d":"Решение работает и для другого значения","c":"total_seconds = 3661\nh = total_seconds // 3600\nm = (total_seconds % 3600) // 60\ns = total_seconds % 60\nassert (h, m, s) == (1, 1, 1)"}],"hint":["hours = total_seconds // 3600","minutes = (total_seconds % 3600) // 60","seconds = total_seconds % 60","Для вывода удобно использовать f-строку: print(f'{total_seconds} сек = {hours} ч {minutes} мин {seconds} сек')"],"solution":"total_seconds = 7384\n\nhours = total_seconds // 3600\nminutes = (total_seconds % 3600) // 60\nseconds = total_seconds % 60\n\nprint(f\"{total_seconds} сек = {hours} ч {minutes} мин {seconds} сек\")\n\nback = hours * 3600 + minutes * 60 + seconds\nprint(f\"{hours} ч {minutes} мин {seconds} сек обратно: {back}\")\nassert back == total_seconds\n"}},{"id":"strings-basics","title":"Строки и f-строки","time":18,"theory":"<p><strong>Строка<\/strong> (<code>str<\/code>) — это последовательность символов в кавычках. Кавычки могут быть\nодинарными, двойными и тройными:<\/p>\n<pre><code>a = 'одинарные'\nb = \"двойные\"\nc = \"\"\"тройные —\nдля нескольких строк\"\"\"\nd = \"Он сказал: \\\"Привет!\\\"\"\nprint(len(a), len(b), len(c) &gt; 10, d)<\/code><\/pre>\n<div class=\"cb-out\">9 7 True Он сказал: \"Привет!\"<\/div>\n\n<h2>Склеивание и повторение<\/h2>\n<pre><code>first = \"Py\"\nlast = \"Camp\"\nprint(first + last)        # конкатенация\nprint(\"-\" * 20)            # повторение\nprint(first, last)         # print сам добавит пробел\nprint(\"a\" \"b\")             # соседние литералы склеиваются: ab<\/code><\/pre>\n<div class=\"cb-out\">PyCamp\n--------------------\nPy Camp\nab<\/div>\n\n<h2>f-строки — главный способ форматирования<\/h2>\n<p>Поставь <code>f<\/code> перед кавычкой — и внутри можно использовать фигурные скобки с любыми выражениями:<\/p>\n<pre><code>name = \"Аня\"\nscore = 9.567\nprint(f\"{name} набрала {score} баллов\")\nprint(f\"{name.upper()} набрала {round(score, 1)} баллов\")   # выражения\nprint(f\"2 + 2 = {2 + 2}, а в скобках: {'да' if score &gt; 9 else 'нет'}\")\nprint(f\"{score:.2f} — два знака после запятой\")\nprint(f\"{score:&gt;10.2f}|\")   # выравнивание вправо, ширина 10\nprint(f\"{1234567:,}\")       # разделители тысяч\nprint(f\"{0.856:.1%}\")       # проценты\nprint(f\"{score=}\")          # отладка: имя и значение<\/code><\/pre>\n<div class=\"cb-out\">Аня набрала 9.567 баллов\nАНЯ набрала 9.6 баллов\n2 + 2 = 4, а в скобках: да\n9.57 — два знака после запятой\n      9.57|\n1,234,567\n85.6%\nscore=9.567<\/div>\n\n<table>\n<tr><th>Формат<\/th><th>Пример<\/th><th>Результат<\/th><\/tr>\n<tr><td><code>:.2f<\/code><\/td><td><code>f\"{3.14159:.2f}\"<\/code><\/td><td>3.14<\/td><\/tr>\n<tr><td><code>:&gt;8<\/code> / <code>:&lt;8<\/code> / <code>:^8<\/code><\/td><td><code>f\"{'x':^8}\"<\/code><\/td><td>по центру, ширина 8<\/td><\/tr>\n<tr><td><code>:0&gt;5<\/code><\/td><td><code>f\"{42:0&gt;5}\"<\/code><\/td><td>00042<\/td><\/tr>\n<tr><td><code>:,<\/code><\/td><td><code>f\"{1000000:,}\"<\/code><\/td><td>1,000,000<\/td><\/tr>\n<tr><td><code>:.1%<\/code><\/td><td><code>f\"{0.256:.1%}\"<\/code><\/td><td>25.6%<\/td><\/tr>\n<\/table>\n\n<h2>Индексация и срезы<\/h2>\n<p>Символы строки доступны по индексу, нумерация с нуля. Отрицательный индекс считает от конца:<\/p>\n<pre><code>s = \"Python\"\nprint(s[0], s[5], s[-1])\nprint(s[1:4])     # с 1 по 3 включительно (4 не входит)\nprint(s[:3], s[3:], s[:])\nprint(s[::2])     # каждый второй символ\nprint(s[::-1])    # строка задом наперёд<\/code><\/pre>\n<div class=\"cb-out\">P n n\nyth\nPyt hon Python\nPto\nnohtyP<\/div>\n\n<div class=\"callout danger\"><div class=\"ct\">⛔ Строки неизменяемы<\/div>\n<p><code>s[0] = 'J'<\/code> → <code>TypeError<\/code>. Чтобы «изменить» строку, создай новую:\n<code>s = 'J' + s[1:]<\/code>.<\/p><\/div>\n\n<h2>Полезные методы строк<\/h2>\n<pre><code>s = \"  Привет, Мир  \"\nprint(s.strip())                 # убрать пробелы по краям\nprint(s.lower(), s.upper())\nprint(s.replace(\"Мир\", \"Python\"))\nprint(\"a,b,c\".split(\",\"))        # ['a', 'b', 'c']\nprint(\"-\".join([\"a\", \"b\", \"c\"])) # a-b-c\nprint(\"Python\".startswith(\"Py\"), \"Python\".find(\"th\"), \"Python\".count(\"t\"))\nprint(\"123\".isdigit(), \"abc\".isalpha(), \"   \".isspace())\nprint(\"заголовок\".capitalize(), \"ДВА СЛОВА\".title())<\/code><\/pre>\n<div class=\"cb-out\">Привет, Мир\n   привет, мир     ПРИВЕТ, МИР\n  Привет, Python\n['a', 'b', 'c']\na-b-c\nTrue 2 1\nTrue True True\nЗаголовок Два Слова<\/div>\n\n<h2>Сырые строки и длина<\/h2>\n<pre><code>print(r\"C:\\new\\text.txt\")   # r-строка: \\n не превращается в перевод строки\nprint(len(\"Python\"))        # 6 символов\nprint(\"П\" in \"Привет\")      # True — оператор in<\/code><\/pre>\n<div class=\"cb-out\">C:\\new\\text.txt\n6\nTrue<\/div>","level":"старт","goal":"Научиться создавать, склеивать и форматировать текстовые данные.","quiz":[{"q":"Что выведет <code>print('Python'[1:3])<\/code>?","options":["Pyt","yt","yth","th"],"answer":1,"explain":"Срез [1:3] берёт символы с индексами 1 и 2 — то есть 'yt'."},{"q":"Что даст <code>f'{2 + 3:0&gt;4}'<\/code>?","options":["0005","5","00005","Ошибка"],"answer":0,"explain":"Выражение 2+3 равно 5, формат 0>4 дополняет слева нулями до ширины 4."},{"q":"Как развернуть строку <code>s<\/code> задом наперёд?","options":["s.reverse()","s[::-1]","reversed(s)","s[-1:0]"],"answer":1,"explain":"Срез с шагом -1 обходит строку с конца. s.reverse() у строк не существует, а reversed(s) возвращает итератор, а не строку."}],"task":{"title":"Генератор бейджа","text":"<p>Сделай бейдж участника конференции. Даны переменные <code>first_name = \"иван\"<\/code>,\n<code>last_name = \"петров\"<\/code>, <code>balance = 1234.5<\/code>, <code>city = \"  Казань  \"<\/code>.<\/p>\n<p>Программа должна вывести ровно три строки:<\/p>\n<pre><code>ИВАН ПЕТРОВ\nГород: Казань\nБаланс: 1 234.50 руб.<\/code><\/pre>\n<p>Подсказка по числам: разделитель тысяч и два знака после запятой задаются форматом <code>:,.2f<\/code>,\nа пробел вместо запятой можно получить методом <code>replace()<\/code>.<\/p>","starter":"first_name = \"иван\"\nlast_name = \"петров\"\nbalance = 1234.5\ncity = \"  Казань  \"\n\n# строка 1: имя и фамилия заглавными\n# строка 2: \"Город: Казань\" (без лишних пробелов)\n# строка 3: \"Баланс: 1 234.50 руб.\"\n","tests":[{"d":"Первая строка: <code>ИВАН ПЕТРОВ<\/code>","c":"assert LINES[0] == 'ИВАН ПЕТРОВ', repr(LINES[0])"},{"d":"Вторая строка: <code>Город: Казань<\/code> (без лишних пробелов)","c":"assert LINES[1] == 'Город: Казань', repr(LINES[1])"},{"d":"Третья строка: <code>Баланс: 1 234.50 руб.<\/code>","c":"assert LINES[2] == 'Баланс: 1 234.50 руб.', repr(LINES[2])"},{"d":"Строки получены из переменных, а не вписаны текстом","s":"(?i)(upper|strip|replace|:\\s*,?\\.?2?f)"},{"d":"Использована f-строка","s":"f['\\\"]"}],"hint":["Имя заглавными: f'{first_name} {last_name}'.upper()","Лишние пробелы убирает city.strip()","Число: f'{balance:,.2f}'.replace(',', ' ')"],"solution":"first_name = \"иван\"\nlast_name = \"петров\"\nbalance = 1234.5\ncity = \"  Казань  \"\n\nprint(f\"{first_name} {last_name}\".upper())\nprint(f\"Город: {city.strip()}\")\nprint(f\"Баланс: {f'{balance:,.2f}'.replace(',', ' ')} руб.\")\n"}},{"id":"input-types","title":"Ввод данных и приведение типов","time":14,"theory":"<h2>Функция input()<\/h2>\n<p><code>input()<\/code> выводит приглашение, ждёт, пока пользователь напечатает текст и нажмёт Enter,\nи <strong>всегда возвращает строку<\/strong>:<\/p>\n<pre><code>name = input(\"Как тебя зовут? \")\nprint(\"Привет,\", name)<\/code><\/pre>\n<div class=\"cb-out\">Как тебя зовут? Аня\nПривет, Аня<\/div>\n\n<div class=\"callout note\"><div class=\"ct\">ℹ️ Как это работает в PyCamp<\/div>\n<p>В редакторе урока настоящий ввод с клавиатуры недоступен — зато есть поле <strong>«ввод»<\/strong> над консолью.\nПеречисли там значения через запятую: они будут по очереди возвращаться вызовами <code>input()<\/code>.\nНапример, <code>Аня, 24<\/code> — первый <code>input()<\/code> вернёт «Аня», второй — «24».<\/p><\/div>\n\n<h2>Приведение типов<\/h2>\n<p>Так как <code>input()<\/code> возвращает строку, числа нужно преобразовывать явно:<\/p>\n<pre><code>age = input(\"Возраст: \")       # пользователь ввёл 24\nprint(type(age))               # &lt;class 'str'&gt;  ← это строка \"24\"!\nage = int(age)                 # теперь число\nprint(type(age), age + 1)      # &lt;class 'int'&gt; 25<\/code><\/pre>\n<div class=\"cb-out\">Возраст: 24\n&lt;class 'str'&gt;\n&lt;class 'int'&gt; 25<\/div>\n\n<table>\n<tr><th>Функция<\/th><th>Превращает<\/th><th>Пример<\/th><\/tr>\n<tr><td><code>int(x)<\/code><\/td><td>в целое (дробная часть отбрасывается)<\/td><td><code>int(\"42\") → 42<\/code>, <code>int(3.9) → 3<\/code><\/td><\/tr>\n<tr><td><code>float(x)<\/code><\/td><td>в дробное<\/td><td><code>float(\"3.5\") → 3.5<\/code><\/td><\/tr>\n<tr><td><code>str(x)<\/code><\/td><td>в строку<\/td><td><code>str(42) → \"42\"<\/code><\/td><\/tr>\n<tr><td><code>bool(x)<\/code><\/td><td>в логическое<\/td><td><code>bool(\"\") → False<\/code>, <code>bool(\"0\") → True<\/code><\/td><\/tr>\n<tr><td><code>list(x)<\/code><\/td><td>в список<\/td><td><code>list(\"abc\") → ['a','b','c']<\/code><\/td><\/tr>\n<\/table>\n\n<div class=\"callout danger\"><div class=\"ct\">⛔ int(\"3.5\") → ValueError<\/div>\n<p>Строку с точкой нельзя превратить в <code>int<\/code> напрямую. Сначала в <code>float<\/code>:\n<code>int(float(\"3.5\")) → 3<\/code>. А <code>int(\"abc\")<\/code> тоже упадёт с <code>ValueError<\/code> —\nв реальных программах ввод проверяют (об этом будет урок про исключения).<\/p><\/div>\n\n<h2>Правила «правдивости» (truthy / falsy)<\/h2>\n<p>Любое значение можно превратить в <code>bool<\/code>. Ложными считаются:<\/p>\n<pre><code>falsy = [False, 0, 0.0, \"\", [], {}, set(), None]\nfor v in falsy:\n    print(repr(v), bool(v))\nprint(bool(\"0\"), bool(\" \"), bool(-1))   # а это уже True!<\/code><\/pre>\n<div class=\"cb-out\">False False\n0 False\n0.0 False\n'' False\n[] False\n{} False\nset() False\nNone False\nTrue True True<\/div>\n\n<h2>Разбор строки на части<\/h2>\n<p>Часто ввод приходит одной строкой — тогда его разбивают методом <code>split()<\/code>:<\/p>\n<pre><code>data = \"Аня 24 Казань\"\nname, age, city = data.split()      # разделение по пробелам\nprint(name, int(age) + 1, city)\n\nnums = \"10,20,30\"\nnumbers = [int(x) for x in nums.split(\",\")]\nprint(numbers, sum(numbers))<\/code><\/pre>\n<div class=\"cb-out\">Аня 25 Казань\n[10, 20, 30] 60<\/div>\n\n<h2>Типовая программа-калькулятор<\/h2>\n<pre><code>a = float(input(\"Первое число: \"))\nb = float(input(\"Второе число: \"))\nop = input(\"Операция (+, -, *, /): \")\n\nif op == \"+\":\n    print(a + b)\nelif op == \"-\":\n    print(a - b)\nelif op == \"*\":\n    print(a * b)\nelse:\n    print(a / b if b else \"на ноль делить нельзя\")<\/code><\/pre>\n<div class=\"cb-out\">Первое число: 12\nВторое число: 5\nОперация (+, -, *, /): *\n60.0<\/div>","level":"старт","goal":"Научиться получать данные от пользователя и правильно их преобразовывать.","quiz":[{"q":"Пользователь ввёл <code>18<\/code> в ответ на <code>input()<\/code>. Какой тип у результата?","options":["int","float","str","bool"],"answer":2,"explain":"input() всегда возвращает строку. Чтобы получить число, нужен int(...) или float(...)."},{"q":"Что произойдёт при <code>int('3.7')<\/code>?","options":["Вернёт 3","Вернёт 4","ValueError","Вернёт 3.7"],"answer":2,"explain":"Строку с точкой int() не понимает. Правильно: int(float('3.7')) → 3."},{"q":"Какое значение считается «правдивым» (truthy)?","options":["<code>\"\"<\/code>","<code>0<\/code>","<code>\"0\"<\/code>","<code>None<\/code>"],"answer":2,"explain":"Непустая строка всегда truthy, даже если в ней ноль. Ложны только пустые значения: '', 0, None, [], {}."}],"task":{"title":"Калькулятор покупок","text":"<p>Программа спрашивает у пользователя <strong>название товара<\/strong>, <strong>цену<\/strong> и\n<strong>количество<\/strong> (три вызова <code>input()<\/code>), а затем выводит две строки:<\/p>\n<pre><code>Кофе x 3 = 1050.00 руб.\nСкидка 5%: 997.50 руб.<\/code><\/pre>\n<p>Цена и количество приходят как строки — не забудь привести их к числам.\nИтог форматируй с двумя знаками после запятой.<\/p>\n<p><strong>Ввод для проверки:<\/strong> <code>Кофе, 350, 3<\/code> (впиши в поле «ввод» над консолью).<\/p>","starter":"name = input(\"Товар: \")\nprice = input(\"Цена: \")\nqty = input(\"Количество: \")\n\n# приведи типы и посчитай сумму\n\n\n# выведи \"Кофе x 3 = 1050.00 руб.\"\n# выведи \"Скидка 5%: 997.50 руб.\"\n","tests":[{"d":"Выведена строка <code>Кофе x 3 = 1050.00 руб.<\/code>","c":"assert LINES[-2].endswith('Кофе x 3 = 1050.00 руб.'), repr(LINES[-2])"},{"d":"Выведена строка <code>Скидка 5%: 997.50 руб.<\/code>","c":"assert LINES[-1].strip() == 'Скидка 5%: 997.50 руб.', repr(LINES[-1])"},{"d":"Цена преобразована в <code>float<\/code>","s":"float\\s*\\("},{"d":"Количество преобразовано в <code>int<\/code>","s":"int\\s*\\("},{"d":"Использованы три вызова <code>input()<\/code>","s":"(input\\s*\\([\\s\\S]*?){3}"},{"d":"Расчёт работает и для других данных","c":"import io, sys, builtins\nvals = ['Чай', '89.9', '7']\nold_in, old_out = builtins.input, sys.stdout\nbuiltins.input = lambda p='': vals.pop(0)\nbuf = io.StringIO(); sys.stdout = buf\ntry:\n    exec(SOURCE_CODE, {})\nfinally:\n    sys.stdout, builtins.input = old_out, old_in\ntext = buf.getvalue()\nassert 'Чай x 7 = 629.30 руб.' in text, text\nassert '597.84' in text or '597.83' in text, text"}],"hint":["price = float(price), qty = int(qty)","total = price * qty; discount = total * 0.95","Формат с двумя знаками: f'{total:.2f}'"],"solution":"name = input(\"Товар: \")\nprice = float(input(\"Цена: \"))\nqty = int(input(\"Количество: \"))\n\ntotal = price * qty\nwith_discount = total * 0.95\n\nprint(f\"{name} x {qty} = {total:.2f} руб.\")\nprint(f\"Скидка 5%: {with_discount:.2f} руб.\")\n","stdin":["Кофе","350","3"]}},{"id":"booleans","title":"Сравнения и логические выражения","time":15,"theory":"<p><strong>Булево значение<\/strong> — это <code>True<\/code> или <code>False<\/code>. Любое сравнение возвращает именно его.<\/p>\n\n<h2>Операторы сравнения<\/h2>\n<table>\n<tr><th>Оператор<\/th><th>Смысл<\/th><th>Пример<\/th><th>Результат<\/th><\/tr>\n<tr><td><code>==<\/code><\/td><td>равно<\/td><td><code>5 == 5<\/code><\/td><td>True<\/td><\/tr>\n<tr><td><code>!=<\/code><\/td><td>не равно<\/td><td><code>5 != 3<\/code><\/td><td>True<\/td><\/tr>\n<tr><td><code>&gt;<\/code> <code>&gt;=<\/code><\/td><td>больше / больше или равно<\/td><td><code>5 &gt;= 5<\/code><\/td><td>True<\/td><\/tr>\n<tr><td><code>&lt;<\/code> <code>&lt;=<\/code><\/td><td>меньше / меньше или равно<\/td><td><code>5 &lt; 3<\/code><\/td><td>False<\/td><\/tr>\n<tr><td><code>in<\/code><\/td><td>входит в<\/td><td><code>'a' in 'cat'<\/code><\/td><td>True<\/td><\/tr>\n<tr><td><code>is<\/code><\/td><td>тот же самый объект<\/td><td><code>x is None<\/code><\/td><td>—<\/td><\/tr>\n<\/table>\n\n<div class=\"callout danger\"><div class=\"ct\">⛔ = против ==<\/div>\n<p><code>=<\/code> присваивает значение, <code>==<\/code> сравнивает. <code>if x = 5:<\/code> — синтаксическая ошибка.\nОдна из самых частых опечаток в истории программирования.<\/p><\/div>\n\n<h2>Логические операторы<\/h2>\n<pre><code>a, b = True, False\nprint(a and b)    # False — оба должны быть True\nprint(a or b)     # True  — хотя бы один True\nprint(not a)      # False — инверсия\nprint(5 &gt; 3 and 10 &gt; 7)     # True\nprint(5 &gt; 3 and not (10 &gt; 7))  # False<\/code><\/pre>\n<div class=\"cb-out\">False\nTrue\nFalse\nTrue\nFalse<\/div>\n\n<h2>Цепочки сравнений<\/h2>\n<p>Python позволяет писать математические двойные неравенства напрямую:<\/p>\n<pre><code>age = 25\nprint(18 &lt;= age &lt; 65)          # True — как в математике\nprint(age == 25 or age == 30)  # True\n# то же самое длинно: 18 &lt;= age and age &lt; 65<\/code><\/pre>\n<div class=\"cb-out\">True\nTrue<\/div>\n\n<h2>Приоритет и порядок вычисления<\/h2>\n<p>Приоритет: <code>not<\/code> → <code>and<\/code> → <code>or<\/code>. Но лучше ставить скобки — так понятнее.<\/p>\n<p>Важная особенность: Python вычисляет логические выражения <strong>лениво<\/strong>, слева направо,\nи останавливается, как только результат очевиден:<\/p>\n<pre><code>def check(name, value):\n    print(\"проверяю\", name)\n    return value\n\nresult = check(\"A\", False) and check(\"B\", True)\nprint(\"результат:\", result)     # B даже не проверяется!<\/code><\/pre>\n<div class=\"cb-out\">проверяю A\nрезультат: False<\/div>\n<p>Это спасает от ошибок: <code>if user is not None and user.age &gt; 18<\/code> не упадёт,\nпотому что вторая часть не выполнится при <code>user = None<\/code>.<\/p>\n\n<h2>and / or возвращают значения, а не только True/False<\/h2>\n<pre><code>print(\"\" or \"по умолчанию\")    # 'по умолчанию' — первое «правдивое»\nprint(None or 0 or \"нет\")      # 'нет'\nprint(\"первое\" and \"второе\")   # 'второе' — если оба истинны\nname = input(\"Имя: \") or \"Гость\"\nprint(name)<\/code><\/pre>\n<div class=\"cb-out\">по умолчанию\nнет\nвторое\nИмя: \nГость<\/div>\n\n<h2>Сравнение разных типов<\/h2>\n<pre><code>print(5 == 5.0)          # True — число и его float-представление равны\nprint(\"5\" == 5)          # False — строка никогда не равна числу\nprint(True == 1)         # True — bool это подкласс int\nprint([1, 2] == [1, 2])  # True — содержимое совпадает\nprint(sorted([3, 1, 2]) == [1, 2, 3])<\/code><\/pre>\n<div class=\"cb-out\">True\nFalse\nTrue\nTrue\nTrue<\/div>\n\n<div class=\"callout tip\"><div class=\"ct\">💡 Таблица истинности<\/div>\n<table style=\"margin:6px 0 0\">\n<tr><th>A<\/th><th>B<\/th><th>A and B<\/th><th>A or B<\/th><th>not A<\/th><\/tr>\n<tr><td>True<\/td><td>True<\/td><td>True<\/td><td>True<\/td><td>False<\/td><\/tr>\n<tr><td>True<\/td><td>False<\/td><td>False<\/td><td>True<\/td><td>False<\/td><\/tr>\n<tr><td>False<\/td><td>True<\/td><td>False<\/td><td>True<\/td><td>True<\/td><\/tr>\n<tr><td>False<\/td><td>False<\/td><td>False<\/td><td>False<\/td><td>True<\/td><\/tr>\n<\/table><\/div>","level":"старт","goal":"Освоить булеву логику — основу всех условий в программировании.","quiz":[{"q":"Чему равно <code>True and False or True<\/code>?","options":["True","False","None","Ошибка"],"answer":0,"explain":"Сначала and: True and False = False, затем or: False or True = True."},{"q":"Что выведет <code>print('5' == 5)<\/code>?","options":["True","False","5","TypeError"],"answer":1,"explain":"Строка и число — разные типы, сравнение по значению даёт False. Исключение: 5 == 5.0 → True."},{"q":"Выражение <code>x != 0 and 10 / x &gt; 2<\/code> при <code>x = 0<\/code>…","options":["Упадёт с ZeroDivisionError","Вернёт False, деление не выполнится","Вернёт True","Вернёт None"],"answer":1,"explain":"Ленивое вычисление: первая часть False, поэтому and сразу возвращает False и вторая часть не вычисляется."}],"task":{"title":"Проверка доступа","text":"<p>Напиши программу проверки доступа к сервису. Даны переменные:<\/p>\n<pre><code>age = 20\nhas_ticket = True\nis_banned = False\nhour = 23<\/code><\/pre>\n<p>Создай и выведи четыре булевы переменные:<\/p>\n<ul>\n<li><code>is_adult<\/code> — возраст не меньше 18;<\/li>\n<li><code>can_enter<\/code> — взрослый, есть билет и не в бане;<\/li>\n<li><code>is_night<\/code> — час не меньше 22 <strong>или<\/strong> меньше 6;<\/li>\n<li><code>final_access<\/code> — может войти и при этом не ночное время\n(ночное время разрешено только если есть билет — учти это через <code>can_enter or is_night<\/code>… нет, проще:\n<code>can_enter and not is_night<\/code>).<\/li>\n<\/ul>\n<p>Выведи каждую переменную на отдельной строке в виде <code>имя = значение<\/code>.<\/p>","starter":"age = 20\nhas_ticket = True\nis_banned = False\nhour = 23\n\n# вычисли is_adult, can_enter, is_night, final_access\n\n\n# выведи 4 строки вида \"is_adult = True\"\n","tests":[{"d":"<code>is_adult<\/code> равно True","c":"assert is_adult is True, is_adult"},{"d":"<code>can_enter<\/code> равно True","c":"assert can_enter is True, can_enter"},{"d":"<code>is_night<\/code> равно True","c":"assert is_night is True, is_night"},{"d":"<code>final_access<\/code> равно False","c":"assert final_access is False, final_access"},{"d":"Выведено 4 строки вида <code>имя = значение<\/code>","c":"import re\nlines = [l for l in LINES if l.strip()]\nassert len(lines) == 4, lines\nassert all(re.match(r'^\\w+ = (True|False)$', l) for l in lines), lines"},{"d":"Логика верна и для ночного времени с баном","c":"age, has_ticket, is_banned, hour = 17, True, True, 3\nis_adult = age >= 18\ncan_enter = is_adult and has_ticket and not is_banned\nis_night = hour >= 22 or hour < 6\nfinal_access = can_enter and not is_night\nassert (is_adult, can_enter, is_night, final_access) == (False, False, True, False)"}],"hint":["is_adult = age >= 18","can_enter = is_adult and has_ticket and not is_banned","is_night = hour >= 22 or hour < 6","Для вывода используй f-строку: print(f'is_adult = {is_adult}')"],"solution":"age = 20\nhas_ticket = True\nis_banned = False\nhour = 23\n\nis_adult = age >= 18\ncan_enter = is_adult and has_ticket and not is_banned\nis_night = hour >= 22 or hour < 6\nfinal_access = can_enter and not is_night\n\nprint(f\"is_adult = {is_adult}\")\nprint(f\"can_enter = {can_enter}\")\nprint(f\"is_night = {is_night}\")\nprint(f\"final_access = {final_access}\")\n"}}],"goal":["понимать, что такое интерпретатор и как выполняется код","выводить данные в консоль и получать их от пользователя","работать с числами, строками и булевыми значениями","знать базовые типы данных и уметь их преобразовывать"]},{"id":"flow","title":"Управление потоком","desc":"Условия, циклы while и for, break/continue, вложенные циклы и сопоставление с образцом match/case.","icon":"🔀","lessons":[{"id":"if-else","title":"Условный оператор if / elif / else","time":15,"theory":"<p>Условный оператор отвечает на вопрос «если…, то…». Синтаксис:<\/p>\n<pre><code>условие:\n    код, если условие истинно<\/code><\/pre>\n\n<pre><code>age = 20\nif age &gt;= 18:\n    print(\"Доступ разрешён\")\nprint(\"Программа продолжается\")<\/code><\/pre>\n<div class=\"cb-out\">Доступ разрешён\nПрограмма продолжается<\/div>\n\n<p>Обрати внимание на три обязательных элемента: ключевое слово <code>if<\/code>, условие,\n<strong>двоеточие<\/strong> и <strong>отступ<\/strong> в 4 пробела у тела.<\/p>\n\n<h2>else — «иначе»<\/h2>\n<pre><code>temperature = -5\nif temperature &gt; 0:\n    print(\"выше нуля\")\nelse:\n    print(\"ниже нуля\")<\/code><\/pre>\n<div class=\"cb-out\">ниже нуля<\/div>\n\n<h2>elif — несколько вариантов<\/h2>\n<p>Когда вариантов больше двух, используют <code>elif<\/code> («else if»). Проверки идут сверху вниз,\nи выполняется <strong>только первая<\/strong> подходящая ветка:<\/p>\n<pre><code>score = 78\n\nif score &gt;= 90:\n    grade = \"отлично\"\nelif score &gt;= 75:\n    grade = \"хорошо\"\nelif score &gt;= 60:\n    grade = \"удовлетворительно\"\nelse:\n    grade = \"неудовлетворительно\"\n\nprint(f\"{score} баллов → {grade}\")<\/code><\/pre>\n<div class=\"cb-out\">78 баллов → хорошо<\/div>\n\n<div class=\"callout warn\"><div class=\"ct\">⚠ Порядок веток важен<\/div>\n<p>Если поставить <code>elif score &gt;= 60<\/code> перед <code>elif score &gt;= 75<\/code>, то 78 попадёт\nв первую подходящую ветку и получит «удовлетворительно». Условия в цепочке <code>elif<\/cod
